name: CTEAS owner/agent-triggered science workflow dispatcher
# An authorized issue comment is a CI event, not a human UI Run workflow click.
# Command: /cteas run <approved-workflow.yml> [input=value ...]
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: write
  issues: write
jobs:
  trusted-science-dispatch:
    if: >-
      github.repository == 'RRain001/CTEAS-next' &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'RRain001' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/cteas run ')
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Authenticate owner request and dispatch approved active science workflow
        uses: actions/github-script@v7
        with:
          script: |
            const {parseDispatchRequest,authorizedIssueComment} =
              require('./.github/scripts/cteas-dispatch.cjs');
            const event=context.payload;
            if (!authorizedIssueComment(event,process.env.GITHUB_REPOSITORY))
              throw Error('UNAUTHORIZED_DISPATCH');
            const {workflow:file,inputs}=parseDispatchRequest(event.comment.body);
            const {owner,repo}=context.repo;
            const registry=await github.paginate(
              github.rest.actions.listRepoWorkflows,{owner,repo,per_page:100});
            const target=registry.find(w =>
              w.path === '.github/workflows/'+file && w.state === 'active');
            if (!target) throw Error('ACTIVE_WORKFLOW_NOT_FOUND: '+file);
            // The selected workflow must itself support workflow_dispatch.
            // GitHub rejects non-dispatch workflows; do not invent a trigger.
            for (const status of ['queued','in_progress','waiting']) {
              const existing=await github.rest.actions.listWorkflowRuns({
                owner,repo,workflow_id:target.id,branch:'main',
                status,per_page:10});
              if (existing.data.workflow_runs.length)
                throw Error('WORKFLOW_ALREADY_ACTIVE: '+file+' status='+status);
            }
            await github.rest.actions.createWorkflowDispatch({
              owner,repo,workflow_id:target.id,ref:'main',inputs});
            const details=Object.entries(inputs).map(([k,v])=>k+'='+v).join(' ');
            core.notice('CTEAS_AGENT_DISPATCH_ACCEPTED: '+file+' on main '+details);
            await github.rest.issues.createComment({
              owner,repo,issue_number:event.issue.number,
              body:'CTEAS dispatch accepted: '+file+' on main; inputs: '+
                (details||'defaults')+
                '. This is submission only, not a scientific PASS. Check downstream Actions logs/SHA/artifacts.'
            });
