name: Issue46 P2-B original/native P3 manual-run workflow contract lint (software only)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/issue46-p2b-real-gshhg-original-makegeo-parity.yml
      - .github/workflows/issue46-p3-source-parity-static-review.yml
permissions:
  contents: read
jobs:
  yaml-and-user-manual-policy-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Validate manual-only P3 source provenance and no automated full science
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'PyYAML==6.0.2'
          python3 - <<'PY'
          import re,yaml
          from pathlib import Path
          target=Path('.github/workflows/issue46-p2b-real-gshhg-original-makegeo-parity.yml')
          text=target.read_text()
          config=yaml.safe_load(text)
          event=config.get('on',config.get(True))
          assert list(event)==['workflow_dispatch'],event
          job=config['jobs']['original-fortran-versus-native-p3-new-real-p2b-lu']
          assert job['timeout-minutes']<=30
          steps=job['steps']
          assert len(steps)>=8 and all('name' in s for s in steps)
          required=[
            '39212589623',
            'bf8941b13085f3cde7bf08f0e6c02e8e36b788909e8d68e2e7e3c4202659bc29',
            '8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41',
            'dfad99a78ed84d655e21411c9d25eb0d2583bf13',
            'native_cpp/reference/compare_p3_makegeo.py',
            'original_makegeo',
            'TERREL_REUSED_NOT_REGENERATED',
            'PASS_SCOPED',
          ]
          for item in required:
            if item=='TERREL_REUSED_NOT_REGENERATED':
              assert 'TERREL_REUSED_NOT_REGENERATED' in text or 'TERREL_REUSED_NOT_REGENERATED' in text.replace('PREVIOUSLY_CAPTURED_HEFEI_',''),item
            else:
              assert item in text,item
          assert 'secrets.' not in text and 'lfs: true' not in text
          assert not re.search(r'^[ ]{2}(push|schedule|pull_request):',text,re.M)
          print('ISSUE46_P2B_P3_MANUAL_WORKFLOW_POLICY_CONTRACT=PASS_SOFTWARE_STATIC_ONLY')
          PY
