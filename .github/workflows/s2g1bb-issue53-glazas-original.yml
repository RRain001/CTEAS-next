name: Issue53 original CTGPROC GLAZAS parity (CTEAS pinned source, manual science)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - native_cpp/reference/validate_p2_glazas_original.py
      - native_cpp/reference/validate_p2_glazas_hits.py
      - native_cpp/reference/diagnose_glazas_mesh_coordinates.py
      - native_cpp/reference/exact_glazas_coordinate_lineage.py
      - native_cpp/reference/coordlib_stage_trace.py
      - native_cpp/reference/tests/test_glazas_exact_lineage.py
      - native_cpp/reference/tests/test_glazas_mesh_coordinates.py
      - native_cpp/reference/tests/test_glazas_direct_candidate.py
      - native_cpp/src/geo/glcc_raw_fractions.cpp
      - native_cpp/include/cteas/geo/glcc_raw_fractions.hpp
      - native_cpp/include/cteas/geo/glcc_direct_laea_probe.hpp
      - native_cpp/include/cteas/geo/glcc_cli_modes.hpp
      - native_cpp/reference/tests/test_glazas_original_gate.py
      - native_cpp/reference/tests/test_glazas_original_integer_hits.py
      - native_cpp/src/p2_glcc_raw_cli.cpp
      - .github/workflows/s2g1bb-issue53-glazas-original.yml
      - docs/plans/ISSUE53_P2_GLAZAS_ORIGINAL_GATE_20261018.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue53-original-glazas-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  CTEAS_SOURCE_COMMIT: dfad99a78ed84d655e21411c9d25eb0d2583bf13
  CTGPROC_SOURCE_SHA256: 719abbd2327269bb0377208b3a7a0c74000b878efc756686023bbb2ef932f281
  GLCC_SOURCE_SHA256: 4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a
jobs:
  comparator-contract-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Original-only comparator and synthetic format tests
        run: |
          set -euo pipefail
          python3 -m unittest -v native_cpp.reference.tests.test_glazas_original_gate native_cpp.reference.tests.test_glazas_original_integer_hits native_cpp.reference.tests.test_glazas_mesh_coordinates native_cpp.reference.tests.test_glazas_direct_candidate native_cpp.reference.tests.test_glazas_exact_lineage
          echo 'P2_GLAZAS_GATE_SOFTWARE=PASS ORIGINAL_GLAZAS_SCIENCE=NOT_RUN'
  authentic-source-build-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout CTEAS-next independent QA source without GLCC IMG
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Checkout frozen original CTEAS source separately, sparse and no LFS
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: engine/vendor/src/CTGPROC_v7.0.0_L150211
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: Install original compiler (no model scientific execution)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran
      - name: Verify source commit and official frozen source file hash, compile real CTGPROC
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original_cteas rev-parse HEAD)" = "$CTEAS_SOURCE_COMMIT"
          vendor="$PWD/original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211"
          test -f "$vendor/ctgproc.for"
          echo "$CTGPROC_SOURCE_SHA256  $vendor/ctgproc.for" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/ctgproc-include"
          for f in "$vendor"/*; do
            test -f "$f" || continue
            bn="${f##*/}"
            ln -s "$f" "${RUNNER_TEMP}/ctgproc-include/${bn,,}"
          done
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic -fno-align-commons \
            -fallow-argument-mismatch -O0 \
            -I"${RUNNER_TEMP}/ctgproc-include" -I"$vendor" \
            "$vendor/ctgproc.for" -o "${RUNNER_TEMP}/original_ctgproc.x"
          test -x "${RUNNER_TEMP}/original_ctgproc.x"
          gfortran --version | head -n 1
          sha256sum "${RUNNER_TEMP}/original_ctgproc.x"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from native_cpp.reference.exact_glazas_coordinate_lineage import create_pinned_instrumented_source
          vendor=Path("original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211/ctgproc.for")
          out=Path(os.environ["RUNNER_TEMP"])/"index-only-original-qa.for"
          sha=create_pinned_instrumented_source(vendor,out)
          print("CTGPROC_DIAGNOSTIC_DERIVATIVE_SHA256=",sha)
          PY
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic -fno-align-commons \
            -fallow-argument-mismatch -O0 \
            -I"${RUNNER_TEMP}/ctgproc-include" -I"$vendor" \
            "${RUNNER_TEMP}/index-only-original-qa.for" -o "${RUNNER_TEMP}/indexed_ctgproc.x"
          test -x "${RUNNER_TEMP}/indexed_ctgproc.x"
          # Build a *separate* stage instrumented COORDLIB include on the
          # frozen original, to detect syntax/Fortran width errors in PR CI.
          # No real IMG or original science is run in PR CI.
          python3 - <<'PY'
          import os
          from pathlib import Path
          from native_cpp.reference.coordlib_stage_trace import create_staged_include
          temp=Path(os.environ["RUNNER_TEMP"])
          source=Path("original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211")
          original_includes=temp/"ctgproc-include"
          staged=temp/"ctgproc-stage-includes"
          staged.mkdir()
          for alias in original_includes.iterdir():
              if alias.name.lower()=="coordlib.for":continue
              if alias.is_file():(staged/alias.name).symlink_to(alias.resolve())
          sha=create_staged_include(source/"COORDLIB.FOR",staged/"coordlib.for")
          print("ORIGINAL_COORDLIB_STAGE_DERIVATIVE_SHA256=",sha)
          PY
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic -fno-align-commons \\
            -fallow-argument-mismatch -O0 \\
            -I"${RUNNER_TEMP}/ctgproc-stage-includes" \\
            -I"${RUNNER_TEMP}/ctgproc-include" -I"$vendor" \\
            "${RUNNER_TEMP}/index-only-original-qa.for" -o "${RUNNER_TEMP}/staged_ctgproc.x"
          test -x "${RUNNER_TEMP}/staged_ctgproc.x"
          echo 'ORIGINAL_CTEAS_SOURCE_AND_INDEXED_STAGE_DERIVATIVE_BUILD=PASS ORIGINAL_GLAZAS_SCIENCE=NOT_RUN'

  genuine-original-glazas:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout CTEAS-next source and original 156 MB GLCC LFS
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - name: Checkout frozen original CTEAS CTGPROC source separately
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: engine/vendor/src/CTGPROC_v7.0.0_L150211
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: Install Fortran and C++ science comparison toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran g++-12 cmake libgdal-dev libssl-dev
      - name: Verify immutable source and compile authentic original CTGPROC
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$(git -C original_cteas rev-parse HEAD)" = "$CTEAS_SOURCE_COMMIT"
          vendor="$PWD/original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211"
          echo "$CTGPROC_SOURCE_SHA256  $vendor/ctgproc.for" | sha256sum -c -
          test "$(wc -c < eausgs2_0la.img)" -eq 156000000
          echo "$GLCC_SOURCE_SHA256  eausgs2_0la.img" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/ctgproc-include"
          for f in "$vendor"/*; do
            test -f "$f" || continue
            bn="${f##*/}"
            ln -s "$f" "${RUNNER_TEMP}/ctgproc-include/${bn,,}"
          done
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic -fno-align-commons \
            -fallow-argument-mismatch -O0 \
            -I"${RUNNER_TEMP}/ctgproc-include" -I"$vendor" \
            "$vendor/ctgproc.for" -o "${RUNNER_TEMP}/original_ctgproc.x"
          test -x "${RUNNER_TEMP}/original_ctgproc.x"
          gfortran --version | head -n 1
          sha256sum "${RUNNER_TEMP}/original_ctgproc.x"
      - name: Build CTEAS-next C++ D1 original-IMG and D3 historical LU writer
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/issue53-glazas-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "${RUNNER_TEMP}/issue53-glazas-build" --parallel 2 --target cteas_p2_glcc_raw cteas_p2_glcc_lu_dat
      - name: Authentic original GLAZAS vs same-source native D1-D3 numerical comparison
        shell: bash
        run: |
          set -euo pipefail
          build="${RUNNER_TEMP}/issue53-glazas-build"
          "$build/cteas_p2_glcc_raw" eausgs2_0la.img "${RUNNER_TEMP}/d1-native" 32650 510.885 3531.269 0.100 50 50 20 --qa-submesh --probe-direct
          # Prevent another full science attempt when the diagnostic trace
          # was silently disabled (observed manual #39178123151).
          python3 - <<'PY'
          import csv,hashlib,json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"d1-native"
          manifest=json.loads((p/"p2_manifest.json").read_text())
          for key,name in (
              ("diagnostic_submesh_csv_sha256","p2_glcc_submesh_diagnostic.csv"),
              ("direct_laea_candidate_hits_csv_sha256","p2_glcc_direct_laea_candidate_hits.csv"),
              ("direct_laea_candidate_mesh_csv_sha256","p2_glcc_direct_laea_mesh.csv"),
          ):
              f=p/name
              assert f.is_file() and f.stat().st_size>0,name
              assert hashlib.sha256(f.read_bytes()).hexdigest()==manifest[key],name
          with (p/"p2_glcc_direct_laea_candidate_hits.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==2500
          total=sum(int(r["samples"]) for r in rows)
          assert total>0, "DIRECT_LAEA_CANDIDATE_ZERO_HITS"
          print("DIRECT_LAEA_CANDIDATE_SCIENCE_INPUT_GATE=PASS candidate_hits=",total)
          PY
          "$build/cteas_p2_glcc_lu_dat" "${RUNNER_TEMP}/d1-native/p2_manifest.json" \
            "${RUNNER_TEMP}/d1-native/p2_glcc_usgs92_gen_replay.csv" "${RUNNER_TEMP}/d3-glcc"
          original_sha="$(sha256sum "${RUNNER_TEMP}/original_ctgproc.x" | awk '{print $1}')"
          python3 -m native_cpp.reference.validate_p2_glazas_hits \
            --source-img eausgs2_0la.img \
            --original-ctgproc "${RUNNER_TEMP}/original_ctgproc.x" --original-bin-sha256 "$original_sha" \
            --original-source-file original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211/ctgproc.for \
            --control-template project/cases/hefei5km_2022_reference_case_20261011/geo/ctgproc/ctgproc.inp \
            --native-lu "${RUNNER_TEMP}/d3-glcc/lu.dat" \
            --native-d3-manifest "${RUNNER_TEMP}/d3-glcc/p2_d3_manifest.json" \
            --native-hits-csv "${RUNNER_TEMP}/d1-native/p2_glcc_usgs92_hits.csv" \
            --native-d1-manifest "${RUNNER_TEMP}/d1-native/p2_manifest.json" \
            --native-qa-csv "${RUNNER_TEMP}/d1-native/p2_glcc_submesh_diagnostic.csv" \
            --direct-probe-hits-csv "${RUNNER_TEMP}/d1-native/p2_glcc_direct_laea_candidate_hits.csv" \
            --native-direct-mesh-csv "${RUNNER_TEMP}/d1-native/p2_glcc_direct_laea_mesh.csv" \
            --original-fortran-include-dir "${RUNNER_TEMP}/ctgproc-include" \
            --out-dir "${RUNNER_TEMP}/glazas-original" --timeout-sec 300
          echo 'P2_ORIGINAL_GLAZAS_SCIENCE=PASS_FRACTION_AND_INTEGER_HITS_IF_TRUE'
      - name: Save manifest and first differences, never vendor/raw-IMG/Fortran binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue53-original-glazas-integer-hits-science
          path: |
            ${{ runner.temp }}/glazas-original/result.json
            ${{ runner.temp }}/glazas-original/FAILED.txt
            ${{ runner.temp }}/d1-native/p2_manifest.json
            ${{ runner.temp }}/d3-glcc/p2_d3_manifest.json
          if-no-files-found: warn
