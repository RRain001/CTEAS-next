name: CTEAS-next SCIENCE C1 2022 143h same-head four-arm (manual)
# Manual full science verification; never run on push or pull_request.
# The original CALMET MET.DAT is a SHA-pinned 2022 frozen reference; current
# CTEAS-next P6 meteorology and both P7 solver arms are freshly executed.
on:
  workflow_dispatch:
  push:
    branches:
      - 'automation/science/c1/**'
    paths:
      - '.github/science-triggers/c1.request'
permissions:
  contents: read
concurrency:
  group: cteas-next-c1-science-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scientific-2022-c1:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact current CTEAS-next science implementation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      # A controlled push is exactly ONE request file commit on latest main.
      # Checkout HEAD^ to ensure the source tree is identical to main and the
      # request commit never becomes part of the scientific source authority.
      - name: Authenticate science execution request and pin source SHA
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" = "push" ]]; then
            [[ "$GITHUB_REF" == refs/heads/automation/science/c1/* ]]
            test "$(git diff --name-only HEAD^ HEAD)" = ".github/science-triggers/c1.request"
            requested="$(sed -n 's/^SOURCE_SHA=//p' .github/science-triggers/c1.request)"
            test -n "$requested"
            test "$requested" = "$(git rev-parse HEAD^)"
            git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
            test "$requested" = "$(git rev-parse refs/remotes/origin/main)"
            git checkout --detach "$requested"
            echo "SCIENCE_AGENT_REQUEST=VALIDATED"
          elif [[ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = refs/heads/main
          else
            echo "::error::Unsupported science trigger event"
            exit 1
          fi
          science_sha="$(git rev-parse HEAD)"
          echo "SCIENCE_SOURCE_SHA=$science_sha" >> "$GITHUB_ENV"
          echo "SCIENCE_EXECUTION_HEAD=$science_sha"
          echo "SCIENCE_TRIGGER_COMMIT=$GITHUB_SHA"
          echo "SCIENCE_WORKFLOW_CASE=C1"
      - name: Checkout frozen original CTEAS for locally restored vendor source
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original-cteas
          persist-credentials: false
      - name: Restore/check excluded original vendor assets for ephemeral runner only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C original-cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          test "$(git rev-parse HEAD)" = "$SCIENCE_SOURCE_SHA"
          python3 scripts/migration/configure_external_assets.py --source-repo original-cteas
          python3 scripts/migration/configure_external_assets.py --check
          test -s engine/vendor/src/CALPUFF_v7.2.1_L150618/calpuff.for
          sha256sum engine/vendor/src/CALPUFF_v7.2.1_L150618/calpuff.for > "$RUNNER_TEMP/c1-original-vendor-source-sha256.txt"
          echo "C1_EPHEMERAL_VENDOR_ASSETS=HASH_VERIFIED"
      - name: Install unchanged original and native scientific toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-12 gfortran-11 cmake libgdal-dev
      - name: Verify frozen 2022 original inputs and record same-head provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          case="project/cases/hefei5km_2022_reference_case_20261011"
          met="$case/run/met/met.dat"
          con="$case/run/puff/puff.con"
          echo "b1823cda92280888d70b00961ab39486036a3086e18637fff21efb4f4b237d30  $met" | sha256sum -c -
          echo "0d51bdb68ff1a5798048bc41067107d3ffe10dc6222f25336df856bcbf48ba10  $con" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/c1"
          {
            echo "CTEAS_NEXT_SHA=$SCIENCE_SOURCE_SHA"
            echo "P6_C1_CURRENT_SOURCE_SHA=$SCIENCE_SOURCE_SHA"
            echo "P7_C1_CURRENT_SOURCE_SHA=$SCIENCE_SOURCE_SHA"
            echo "ORIGINAL_CTEAS_SOURCE_SHA=dfad99a78ed84d655e21411c9d25eb0d2583bf13"
            echo "ORIGINAL_CALMET_C1_MET=FROZEN_2022_SHA_VERIFIED_NOT_FRESH_VENDOR_CALMET_RERUN"
          } > "$RUNNER_TEMP/c1/source-manifest.txt"
          echo "C1_SAME_CURRENT_HEAD_P6_P7=PASS"
      - name: Build actual 143h P6D P6E P6F source chain on current HEAD
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/c1/p6d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$RUNNER_TEMP/c1/p6d" --parallel 2 --target cteas_p6_realcase_wind_field cteas_p6_native_cgamma_grid_143h cteas_p6_native_hourly_driver cteas_p6_native_comp_history_tests
          cmake -S native_cpp/modules/p6_calmet/p6e -B "$RUNNER_TEMP/c1/p6e" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$RUNNER_TEMP/c1/p6e" --parallel 2 --target p6e_calmet_dat21 p6e_p6c_hourly_bridge
          cmake -S native_cpp/modules/p6_calmet/p6f -B "$RUNNER_TEMP/c1/p6f" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DP6F_REPO_ROOT="$GITHUB_WORKSPACE"
          cmake --build "$RUNNER_TEMP/c1/p6f" --parallel 2 --target cteas_p6f_geo_static_provenance cteas_p6f_p6e_source_metadata
      - name: Execute current P6 actual 143h without the frozen original MET in its case directory
        shell: bash
        run: |
          set -euo pipefail
          case="$GITHUB_WORKSPACE/project/cases/hefei5km_2022_reference_case_20261011"
          frozen="$case/run/met/met.dat"
          withheld="$RUNNER_TEMP/c1/fortran-met-not-available-to-current-native-case.dat"
          test -s "$frozen" && test ! -e "$withheld"
          mv "$frozen" "$withheld"
          restore_frozen() { if test -f "$withheld"; then mv "$withheld" "$frozen"; fi; }
          trap restore_frozen EXIT
          test ! -e "$frozen"
          "$RUNNER_TEMP/c1/p6d/cteas_p6_native_hourly_driver" \
            --case "$case" \
            --p6d "$RUNNER_TEMP/c1/p6d/cteas_p6_realcase_wind_field" \
            --p6e "$RUNNER_TEMP/c1/p6e/p6e_calmet_dat21" \
            --bridge "$RUNNER_TEMP/c1/p6e/p6e_p6c_hourly_bridge" \
            --cgamma "$RUNNER_TEMP/c1/p6d/cteas_p6_native_cgamma_grid_143h" \
            --work "$RUNNER_TEMP/c1/native-p6" --hours 143 --emit-source-stage-trace \
            --p6f-writer "$RUNNER_TEMP/c1/p6f/cteas_p6f_geo_static_provenance" \
            --p6e-source-builder "$RUNNER_TEMP/c1/p6f/cteas_p6f_p6e_source_metadata" \
            --p6f-direct-hourly > "$RUNNER_TEMP/c1/native-p6-143h.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/c1/native-p6-143h.log"; exit 1;
            }
          test ! -e "$frozen"
          restore_frozen
          trap - EXIT
          echo "b1823cda92280888d70b00961ab39486036a3086e18637fff21efb4f4b237d30  $frozen" | sha256sum -c -
          candidate="$RUNNER_TEMP/c1/native-p6/native_causal_independent_header_calmet.dat"
          test -s "$candidate"
          grep -q '"original_met_role": "NOT_REQUIRED_NOT_OPENED_BY_NATIVE_EXECUTION"' "$RUNNER_TEMP/c1/native-p6/native_cpp_hourly_manifest.json"
          "$RUNNER_TEMP/c1/p6e/p6e_calmet_dat21" compare --reference "$frozen" --candidate "$candidate" --out "$RUNNER_TEMP/c1/C1-P6-143h-45field-verdict.json"
          sha256sum "$candidate" "$frozen" > "$RUNNER_TEMP/c1/meteorology-sha256.txt"
          echo "C1_CURRENT_NATIVE_P6_143H_AND_STRICT_FIELD_GATE=PASS"
      - name: Execute fresh original CALPUFF A and C for both frozen and current P6 meteorology
        shell: bash
        run: |
          set -euo pipefail
          case="project/cases/hefei5km_2022_reference_case_20261011"
          mkdir -p "$RUNNER_TEMP/c1/results"
          python3 native_cpp/modules/p7_calpuff/reference/run_c1_original_calpuff_pair.py \
            --vendor engine/vendor/src/CALPUFF_v7.2.1_L150618 \
            --puff-control "$case/run/puff/puff.inp" \
            --original-met "$case/run/met/met.dat" \
            --native-met "$RUNNER_TEMP/c1/native-p6/native_causal_independent_header_calmet.dat" \
            --original-puff-con "$case/run/puff/puff.con" \
            --p6-helper native_cpp/modules/p6_calmet/p6f/tests/verify_original_calpuff_reads_written_calmet.py \
            --compiler /usr/bin/gfortran-11 \
            --out "$RUNNER_TEMP/c1/results" > "$RUNNER_TEMP/c1/vendor-A-C.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/c1/vendor-A-C.log"; exit 1;
            }
          test -s "$RUNNER_TEMP/c1/results/A-original-calpuff.con"
          test -s "$RUNNER_TEMP/c1/results/C-original-calpuff.con"
          echo "C1_FRESH_VENDOR_CALPUFF_A_C=PASS"
      - name: Generate independent original Fortran DGM for native P7 strict B
        shell: bash
        run: |
          set -euo pipefail
          case="project/cases/hefei5km_2022_reference_case_20261011"
          root="$RUNNER_TEMP/c1"
          mkdir -p "$root/frozen/run/puff" "$root/frozen/deliverables/met"
          cp "$case/run/puff/puff.inp" "$root/frozen/run/puff/puff.inp"
          ln -s "$GITHUB_WORKSPACE/$case/run/met/met.dat" "$root/frozen/deliverables/met/met.dat"
          python3 native_cpp/modules/p7_calpuff/reference/dgm_p7_advection_2022/original_calcpf_receiver_oracle.py \
            --vendor engine/vendor/src/CALPUFF_v7.2.1_L150618 \
            --case "$root/frozen" --out "$root/vendor" --compiler /usr/bin/gfortran-11 \
            --hour 9 --receptor-i 42 --receptor-j 11 \
            --trace-h9-setpuf --allow-no-receptor-events > "$root/vendor-dgm.log" 2>&1 || {
              tail -n 100 "$root/vendor-dgm.log"; exit 1;
            }
          test -s "$root/vendor/case/run/puff/dgm_puffstep.bin"
          echo "C1_FRESH_ORIGINAL_VENDOR_DGM=PASS"
      - name: Build current native P7 COMP source and validate original terrain
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p7_calpuff -B "$RUNNER_TEMP/c1/p7-build" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$RUNNER_TEMP/c1/p7-build" --parallel 2 --target cteas_p7_hefei_sixhour_native_h3_receptors_tests cteas_p7_original_native_terrain_tests
          "$RUNNER_TEMP/c1/p7-build/cteas_p7_original_native_terrain_tests"
      - name: B same original MET 143h native P7 strict DGM and whole frozen WROUT1
        shell: bash
        run: |
          set -euo pipefail
          case="project/cases/hefei5km_2022_reference_case_20261011"
          root="$RUNNER_TEMP/c1"
          CTEAS_P7_NATIVE_PUFF_CON="$root/results/B-original-met-native-p7.con" \
          CTEAS_P7_MAKEGEO_INP="$case/geo/makegeo/makegeo.inp" \
          CTEAS_P7_PROBE_HOURS=143 "$root/p7-build/cteas_p7_hefei_sixhour_native_h3_receptors_tests" \
            "$case/run/met/met.dat" "$case/run/puff/puff.inp" "$case/run/puff/puff.con" \
            "$root/vendor/case/run/puff/dgm_puffstep.bin" > "$root/native-B-143h.log" 2>&1 || {
              tail -n 100 "$root/native-B-143h.log"; exit 1;
            }
          grep -F 'P7_HEFEI_REAL_EXTENDED_SOURCE_PROBE=PASS HOURS=143 ORIGINAL_DGM_ROWS=254687 H3_REAL4_WORDS=357500/357500 FIRST_DIFFERENCE=NONE' "$root/native-B-143h.log"
          grep -F 'P7_NATIVE_PUFF_CON_FULL=PASS HOURS=143 RECORDS=3655 BYTES=1896056 BINARY_EXACT=YES' "$root/native-B-143h.log"
          cmp "$root/results/B-original-met-native-p7.con" "$case/run/puff/puff.con"
          echo "0d51bdb68ff1a5798048bc41067107d3ffe10dc6222f25336df856bcbf48ba10  $root/results/B-original-met-native-p7.con" | sha256sum -c -
          echo "C1_CURRENT_P7_B_ORIGINAL_MET_143H_BIT_EXACT=PASS"
      - name: D current native MET 143h current native P7 strict against freshly rerun original C
        shell: bash
        run: |
          set -euo pipefail
          case="project/cases/hefei5km_2022_reference_case_20261011"
          root="$RUNNER_TEMP/c1"
          CTEAS_P7_INTEGRATION_C1=1 \
          CTEAS_P7_PROBE_HOURS=143 \
          CTEAS_P7_NATIVE_PUFF_CON="$root/results/D-native-met-native-p7.con" \
          CTEAS_P7_MAKEGEO_INP="$case/geo/makegeo/makegeo.inp" \
            "$root/p7-build/cteas_p7_hefei_sixhour_native_h3_receptors_tests" \
              "$root/native-p6/native_causal_independent_header_calmet.dat" \
              "$case/run/puff/puff.inp" "$root/results/C-original-calpuff.con" \
              > "$root/native-D-143h.log" 2>&1 || {
                tail -n 100 "$root/native-D-143h.log"; exit 1;
              }
          grep -F 'P7_C1_NATIVE_ON_PR53_MET HOURS=143 REAL4_MATCHED=357500/357500' "$root/native-D-143h.log"
      - name: Independently verify same-MET A/B and C/D bitwise REAL4 and different-MET sensitivity
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/c1/results"
          compare=native_cpp/modules/p7_calpuff/reference/compare_p7_hourly_concentrations.py
          python3 "$compare" --a "$root/A-original-calpuff.con" --b "$root/B-original-met-native-p7.con" --nx 50 --ny 50 --hours 143 --require-bit-exact --report "$root/C1-same-MET-AB.json"
          python3 "$compare" --a "$root/C-original-calpuff.con" --b "$root/D-native-met-native-p7.con" --nx 50 --ny 50 --hours 143 --require-bit-exact --report "$root/C1-same-MET-CD.json"
          python3 "$compare" --a "$root/A-original-calpuff.con" --b "$root/C-original-calpuff.con" --nx 50 --ny 50 --hours 143 --report "$root/C1-different-MET-AC.json"
          python3 "$compare" --a "$root/B-original-met-native-p7.con" --b "$root/D-native-met-native-p7.con" --nx 50 --ny 50 --hours 143 --report "$root/C1-different-MET-BD.json"
          sha256sum "$root/"*.con > "$RUNNER_TEMP/c1/four-arm-concentration-sha256.txt"
          python3 - "$root" "$SCIENCE_SOURCE_SHA" <<'PY'
          import json, pathlib, sys
          root, commit = pathlib.Path(sys.argv[1]), sys.argv[2]
          same = [json.loads((root/n).read_text()) for n in ("C1-same-MET-AB.json", "C1-same-MET-CD.json")]
          assert all(x["hours"]==143 and x["values"]==357500 and x["matching_real4"]==357500 and x["bitwise_identical"] for x in same)
          out={"current_source_sha":commit, "scenario":"C1_2022_FROZEN_ORIGINAL_MET_AND_FRESH_CURRENT_P6", "four_arms_executed":True,
               "c1_p6_143h":"PASS_SCOPED","c1_same_met_p7_ab_cd":"PASS_SCOPED","c1_four_arm":"PASS_SCOPED",
               "original_calmet_2022_fresh_rerun":"NOT_RUN_FROZEN_REFERENCE_INPUT"}
          (root/"C1-final-science-verdict.json").write_text(json.dumps(out,indent=2)+"\n")
          print("CTEAS_NEXT_C1_143H_FOUR_ARM_CURRENT_HEAD=PASS_SCOPED")
          PY
      - name: Preserve only derived numerical evidence and hashes (no vendor code or raw restricted inputs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cteas-next-c1-current-head-143h-report
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/c1/source-manifest.txt
            ${{ runner.temp }}/c1-original-vendor-source-sha256.txt
            ${{ runner.temp }}/c1/meteorology-sha256.txt
            ${{ runner.temp }}/c1/four-arm-concentration-sha256.txt
            ${{ runner.temp }}/c1/C1-P6-143h-45field-verdict.json
            ${{ runner.temp }}/c1/results/C1-*.json
            ${{ runner.temp }}/c1/native-p6-143h.log
            ${{ runner.temp }}/c1/native-B-143h.log
            ${{ runner.temp }}/c1/native-D-143h.log
