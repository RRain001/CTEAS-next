name: Issue46 Shanghai Dongtan real 2022 coastal P2-B 52/55 (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue46-shanghai-real-coastal-p2b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-shanghai-utm51n-gshhg-full-35-to-38:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed source, no GLC download or credentials in CI
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Require actual 2022 Shanghai GLC crop and original source provenance
        run: |
          set -euo pipefail
          TIF=data/landcover/glc_fcs30d/v1_2022/shanghai_dongtan/shanghai_dongtan_2022_30m.tif
          META=data/landcover/glc_fcs30d/v1_2022/shanghai_dongtan/metadata.json
          if [ ! -s "$TIF" ] || [ ! -s "$META" ]; then
            echo 'BLOCKED_REAL_SHANGHAI_GLC2022_NOT_PRESENT: owner must use scripts/s2g/glc_fcs30d_shanghai_acquire.py download via authenticated Earth Engine and commit verified small TIFF+metadata+attribution'
            exit 2
          fi
      - name: Install bounded native GDAL/GEOS, Python raster verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            cmake g++-12 libgdal-dev libssl-dev gdal-bin python3-gdal \
            python3-rasterio python3-pyproj python3-numpy
      - name: Verify real GLC source and model grid extent; no offshore NoData fill
        run: |
          set -euo pipefail
          /usr/bin/python3 -m scripts.s2g.glc_fcs30d_shanghai_acquire verify
          /usr/bin/python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/landcover/glc_fcs30d/v1_2022/shanghai_dongtan/metadata.json')
          j=json.loads(p.read_text())
          assert j['region'].startswith('Shanghai Dongtan')
          assert j['epsg']==32651 and j['nx']==j['ny']==50
          assert j['modelgrid_source_coverage_ok'], 'BLOCKED_GLC_OFFSHORE_NODATA_IN_MODEL_GRID'
          assert j['glc210_coverage_ok'], 'BLOCKED_NO_REAL_GLC210_WATER_IN_MODEL_GRID'
          print('SHANGHAI_REAL_GLC_SOURCE_GATE=PASS',j['sha256'])
          PY
      - name: Restore verified permanent project GSHHG Release Full L1
        run: |
          set -euo pipefail
          python3 scripts/s2g/gshhg_v237_cache.py fetch \
            --source project-release --cache "${RUNNER_TEMP}/gshhg/2.3.7"
          python3 scripts/s2g/gshhg_v237_cache.py verify \
            --cache "${RUNNER_TEMP}/gshhg/2.3.7"
      - name: Check this exact Shanghai 5km study box intersects a real GSHHG coast
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from osgeo import ogr,osr
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          coast=root/'gshhg/2.3.7/GSHHS_f_L1/GSHHS_f_L1.shp'
          ds=ogr.Open(str(coast))
          assert ds is not None
          l=ds.GetLayer()
          l.SetSpatialFilterRect(121.7,31.3,122.2,31.8)
          s=osr.SpatialReference();s.ImportFromEPSG(4326)
          s.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          t=osr.SpatialReference();t.ImportFromEPSG(32651)
          t.SetAxisMappingStrategy(osr.OAMS_TRADITIONAL_GIS_ORDER)
          tr=osr.CoordinateTransformation(s,t)
          x0,y0=400655.,3485184.
          box=ogr.CreateGeometryFromWkt(
            f'POLYGON (({x0} {y0}, {x0+5000} {y0}, {x0+5000} {y0+5000}, {x0} {y0+5000}, {x0} {y0}))')
          land=0.
          for feat in l:
            g=feat.GetGeometryRef().Clone()
            g.Transform(tr)
            if g.Intersects(box):
              intersect=g.Intersection(box)
              if intersect is not None:
                land+=intersect.GetArea()
          if not (100. < land < 25_000_000.-100.):
            raise RuntimeError('SHANGHAI_GRID_DOES_NOT_ACTUALLY_CROSS_GSHHG_L1_COAST')
          print('SHANGHAI_GSHHG_FULL_REAL_L1_COAST_CROSSED_AREA_M2',land,'WATER_M2',25_000_000.-land)
          PY
      - name: Compile 2022 P2-B native map into USGS38 LU.DAT
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/p2b-coast-build" \
            -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/p2b-coast-build" --parallel 2 --target cteas_p2_glc_lu_dat
      - name: REAL Shanghai 30m coast polygon intersection and 35-to-38 conservation
        run: |
          set -euo pipefail
          TIF=data/landcover/glc_fcs30d/v1_2022/shanghai_dongtan/shanghai_dongtan_2022_30m.tif
          POLICY=docs/plans/ISSUE53_GLC35_USGS38_USER_SELECTED_20261019.json
          COAST="${RUNNER_TEMP}/gshhg/2.3.7/GSHHS_f_L1/GSHHS_f_L1.shp"
          "${RUNNER_TEMP}/p2b-coast-build/cteas_p2_glc_lu_dat" \
            "$TIF" "$(sha256sum "$TIF" | cut -d' ' -f1)" \
            "$COAST" "$(sha256sum "$COAST" | cut -d' ' -f1)" \
            "$POLICY" "$(sha256sum "$POLICY" | cut -d' ' -f1)" \
            "${RUNNER_TEMP}/shanghai-real-p2b" 32651 400.655 3485.184 0.100 50 50
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          out=root/'shanghai-real-p2b'
          meta=json.loads(Path('data/landcover/glc_fcs30d/v1_2022/shanghai_dongtan/metadata.json').read_text())
          m=json.loads((out/'p2_b_d3_manifest.json').read_text())
          assert m['n_cells']==2500 and m['n_usgs_classes']==38
          assert m['glc_tif_sha256']==meta['sha256']
          assert m['max_fraction_sum_error']<1e-9
          water52=m['usgs52_inland_water_area_m2']
          water55=m['usgs55_ocean_water_area_m2']
          if water52<=0 or water55<=0:
            raise ValueError('BLOCKED_NOT_BOTH_REAL_GLC210_INLAND_AND_MARINE; do not classify synthetic data as a coastal PASS')
          rows=(out/'lu.dat').read_text().splitlines()
          assert len(rows)==2511 and len(rows[10].split())==38
          categories=list(map(int,rows[10].split()))
          i52=categories.index(52);i55=categories.index(55)
          count_mixed=0
          max_print_sum_error=0.
          for line in rows[11:]:
            v=line.split()
            assert len(v)==41 and v[-1]=='.'
            f=list(map(float,v[2:-1]))
            max_print_sum_error=max(max_print_sum_error,abs(sum(f)-1.))
            if f[i52]>0 and f[i55]>0:count_mixed+=1
          assert max_print_sum_error<=.02
          att={'status':'PASS_REAL_SHANGHAI_SOURCE_ENGINEERING_52_55_BOTH_PRESENT',
            'glc_tif_sha256':meta['sha256'],
            'gshhg_archive_sha256':'8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41',
            'gshhs_full_l1_shp_sha256':m['gshhs_l1_shp_sha256'],
            'lu_dat_sha256':m['lu_dat_sha256'],
            'usgs52_inland_m2':water52,'usgs55_marine_m2':water55,
            'cells_both_52_and_55':count_mixed,
            'max_printed_fraction_sum_error':max_print_sum_error,
            'real_coastline_position_accuracy':'NOT_INDEPENDENTLY_VERIFIED',
            'original_makegeo_p3_parity':'NOT_RUN',
            'full_vs_high_sensitivity':'NOT_RUN',
            'science_status':'PARTIAL_REAL_SOURCE_ONLY'}
          (out/'shanghai_real_coastal_qa.json').write_text(json.dumps(att,indent=2)+'\n')
          print(json.dumps(att,sort_keys=True))
          PY
      - name: Publish bounded real coastal evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue46-shanghai-2022-real-GLC30m-GSHHG-Full-coastal-gate
          path: |
            ${{ runner.temp }}/shanghai-real-p2b/lu.dat
            ${{ runner.temp }}/shanghai-real-p2b/p2_b_d3_manifest.json
            ${{ runner.temp }}/shanghai-real-p2b/shanghai_real_coastal_qa.json
          if-no-files-found: warn
