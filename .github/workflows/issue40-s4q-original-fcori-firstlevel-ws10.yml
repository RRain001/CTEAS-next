name: Issue40 S4-Q original FCORI and first wind plane WS10 63x6 strict source arithmetic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-two-observed-surface-site-original-geo:
    runs-on: ubuntu-22.04
    timeout-minutes: 95
    steps:
      - name: Checkout authenticated original SRTM and GLCC with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Checkout pinned untouched independent Fortran MAKEGEO source
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: |
            engine/vendor/src/MAKEGEO_V3.2_L110401
            engine/vendor/src/CALMET_v6.5.0_L150223
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - name: Install native executors and reference raster/geographic packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++-12 gfortran cmake libgdal-dev libssl-dev \
            python3-gdal python3-rasterio python3-numpy python3-yaml python3-pyproj python3-pandas
          git rev-parse HEAD > "$RUNNER_TEMP/s4h-checkout-sha.txt"
          srtm=calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif
          glcc=eausgs2_0la.img
          echo "913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4  $srtm" | sha256sum -c -
          echo "4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a  $glcc" | sha256sum -c -
          test "$(git -C original_cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          vendor=original_cteas/engine/vendor/src/MAKEGEO_V3.2_L110401
          echo "8c4fb11db36d4b976b54f470b7a06ce4e38ab09e934951b0e2c613bddc34e347  $vendor/makegeo.for" | sha256sum -c -
          cmake -S native_cpp/p1 -B "$RUNNER_TEMP/s4h-p1" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4h-p1" --parallel 2 --target cteas_p1_terrain_case
          cmake -S native_cpp -B "$RUNNER_TEMP/s4h-p2" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4h-p2" --parallel 2 --target cteas_p2_glcc_raw cteas_p2_glcc_lu_dat
          cmake -S native_cpp/p3 -B "$RUNNER_TEMP/s4h-p3" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4h-p3" --parallel 2 --target cteas_p12_to_p3_dat cteas_p3_makegeo
      - name: Generate exact authentic two-observed-SS NOAA site B0 from original catalog
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json,os,pathlib,yaml
          from native_cpp.modules.p5_smerge.data_prep import download_isd_by_grid as p5
          from native_cpp.modules.p4_read62.data_prep import download_igra as p4
          from scripts.s3f.verify_real_noaa_2022_2023_station_selection import generate_grid,P5_STATIONS
          from native_cpp.orchestration.case_admission import admit_case
          from engine.run_met.station_grid import load_strict_utm_grid
          from scripts.s2g.issue56_real_noaa_p5_case import _case_dict
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"s4h_huoshan_xinqiao_true_2ss_2022"
          assert not root.exists()
          history=p5.parse_history_txt(pathlib.Path("engine/resources/isd/isd-history.txt"))
          selected={s.sid:s for s in history if s.sid in P5_STATIONS}
          assert set(selected)==set(P5_STATIONS)
          coords=[(selected[sid].lat,selected[sid].lon) for sid in P5_STATIONS]
          grid_path,center,_=generate_grid(root/"grid",coords)
          grid=load_strict_utm_grid(grid_path)
          assert grid.iutmzn==50 and grid.lsohem=="N" and grid.nz==9
          assert (f"{grid.xrefkm:.3f}",f"{grid.yrefkm:.3f}")==("426.590","3464.125")
          assert grid.dgridkm==1.0 and 0<grid.nx<=500 and 0<grid.ny<=500
          from native_cpp.modules.p5_smerge.data_prep.download_isd_by_grid import station_in_utm_grid
          in_domain=[s.sid for s in history if station_in_utm_grid(s,grid)
                     and p5.covers_interval(s.begin,s.end,__import__("datetime").datetime(2022,1,1),
                                             __import__("datetime").datetime(2022,12,31,23))]
          assert set(in_domain)==set(P5_STATIONS),(in_domain,grid.nx,grid.ny)
          lat=sum(c[0] for c in coords)/2
          lon=sum(c[1] for c in coords)/2
          upper=p4.load_station_list(pathlib.Path("engine/resources/igra/igra2-station-list.txt"))
          inside,outside=p4.candidate_groups(upper,lat,lon,grid,2022)
          assert not inside and outside and outside[0]["id"]=="CHM00058424", (inside,outside[:2])
          begin,end="20220601-010000","20220601-070000"
          (root/"grid/research_time").write_text(f"BEGIN: {begin}\nEND: {end}\n")
          case=_case_dict(root.name,grid,lat,lon,begin,end)
          (root/"case.yaml").write_text(yaml.safe_dump(case,sort_keys=False))
          approved=admit_case(root/"case.yaml")
          assert approved.grid_sha256==__import__("hashlib").sha256(grid_path.read_bytes()).hexdigest()
          assert (approved.nx,approved.ny)==(grid.nx,grid.ny)
          assert approved.research_begin==begin and approved.research_end==end
          (root/"evidence").mkdir()
          proof={"status":"S4H_REAL_2SS_NOAA_CATALOG_B0_SAME_GRID",
                 "grid_sha256":approved.grid_sha256,
                 "case_yaml_sha256":approved.case_sha256,
                 "research_time_sha256":approved.time_sha256,
                 "grid_origin_km":["426.590","3464.125"],
                 "nx":grid.nx,"ny":grid.ny,"nz":grid.nz,"spacing_km":grid.dgridkm,
                 "true_surface_source_station_ids":list(P5_STATIONS),
                 "upper_real_noaa_source":"CHM00058424",
                 "upper_original_site_role":"OUTSIDE_DOMAIN_VIRTUAL_SOURCE",
                 "observed_surface_site_role":"TWO_DISTINCT_PHYSICAL_IN_GRID",
                 "time_begin_utc":begin,"time_end_utc":end,
                 "P6_G19":"NOT_RUN","P6_FIELD45":"NOT_RUN"}
          (root/"evidence/b0-real-station-grid.json").write_text(json.dumps(proof,indent=2)+"\n")
          print("S4H_AUTHENTIC_TWO_OBSERVED_SURFACE_GRID_B0=PASS NX",grid.nx,"NY",grid.ny,"NGRID",grid.nx*grid.ny)
          PY
      - name: Generate real P2A original historical GLCC 38-class LU for same B0
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          /usr/bin/python3 -m native_cpp.orchestration.p2a_case_producer \
            --case-yaml "$case/case.yaml" \
            --glcc-img "$PWD/eausgs2_0la.img" \
            --raw-bin "$RUNNER_TEMP/s4h-p2/cteas_p2_glcc_raw" \
            --lu-bin "$RUNNER_TEMP/s4h-p2/cteas_p2_glcc_lu_dat"
      - name: Crop original SHA-pinned 90m SRTM into bounded lossless large-grid pixel window
        shell: bash
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          /usr/bin/python3 -m scripts.s2g.issue42_s3_b1_true_srtm_window \
            --case-yaml "$case/case.yaml" \
            --original-tif "$PWD/calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif" \
            --original-sha256 913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4 \
            --cropped-tif "$case/inputs/p1_srtm90_source_window.tif" \
            --manifest "$case/inputs/p1_srtm90_source_window.json"
          /usr/bin/python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"s4h_huoshan_xinqiao_true_2ss_2022/inputs/p1_srtm90_source_window.json"
          a=json.loads(p.read_text())
          assert a["status"]=="TRUE_SOURCE_WINDOW_PIXEL_IDENTITY_PASS_NOT_P1_SCIENCE"
          assert a["window_pixel_count"]<=5_000_000 and a["valid_source_pixels"]>0
          print("S4H_REAL_LARGER_GRID_SOURCE_PIXEL_WINDOW=PASS PIXELS",a["window_pixel_count"])
          PY
      - name: Reuse actual native P1 TERREL plus P2A LU to produce genuinely new large-grid GEO
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          tif_sha="$(/usr/bin/python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["cropped_source_sha256"])' "$case/inputs/p1_srtm90_source_window.json")"
          /usr/bin/python3 -m native_cpp.orchestration.p3_case_handoff \
            --case-yaml "$case/case.yaml" \
            --p1-tif "$case/inputs/p1_srtm90_source_window.tif" \
            --p1-tif-sha256 "$tif_sha" \
            --p1-bin "$RUNNER_TEMP/s4h-p1/cteas_p1_terrain_case" \
            --dat-bin "$RUNNER_TEMP/s4h-p3/cteas_p12_to_p3_dat" \
            --p3-bin "$RUNNER_TEMP/s4h-p3/cteas_p3_makegeo" --p2-kind A
          test -s "$case/geo/makegeo/p3_case/geo.dat"
      - name: Freshly compile unmodified SHA-pinned original MAKEGEO 3.2 Fortran
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/s4h"
          vendor="$GITHUB_WORKSPACE/original_cteas/engine/vendor/src/MAKEGEO_V3.2_L110401"
          mkdir -p "$root/vendor-includes"
          for file in "$vendor"/*; do
            lower="$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            ln -s "$file" "$root/vendor-includes/$lower"
          done
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic \
            -fno-align-commons -fallow-argument-mismatch -O0 \
            -I"$root/vendor-includes" "$root/vendor-includes/makegeo.for" \
            -o "$root/original-makegeo.x"
          sha256sum "$root/original-makegeo.x" > "$root/original-makegeo-bin-sha256.txt"
      - name: Independently rerun original MAKEGEO against identical new large-grid LU TERREL and deck
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os,re,pathlib
          from native_cpp.orchestration.case_admission import admit_case
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          case=root/"s4h_huoshan_xinqiao_true_2ss_2022"
          approved=admit_case(case/"case.yaml")
          work=root/"s4h/original-makegeo-run"
          work.mkdir(parents=True)
          for name,p in [
            ("lu.dat",case/"geo/ctgproc/p2a_case/lu/lu.dat"),
            ("terrel.dat",case/"geo/makegeo/p3_case/terrel.dat"),
          ]:
            assert p.stat().st_size>1000
            (work/name).symlink_to(p)
          original=(case/"geo/makegeo/p3_case/makegeo.inp").read_text()
          for key,value in (
            ("LUDAT","lu.dat"),("TERRDAT","terrel.dat"),
            ("GEODAT","original_geo.dat"),("RUNLST","original_makegeo.lst")
          ):
            original,count=re.subn(rf"(!\s*{key}\s*=\s*)([^!]*)(!)",
                                   lambda m:m.group(1)+value+" "+m.group(3),original)
            assert count==1,(key,count)
          (work/"makegeo.inp").write_text(original)
          (work/"MAKEGEO.INP").symlink_to("makegeo.inp")
          lu=(work/"lu.dat").read_text().splitlines()
          assert len(lu)==approved.nx*approved.ny+11,(len(lu),approved.nx,approved.ny)
          for idx,line in enumerate(lu[11:]):
            vals=line.split()
            assert len(vals)==41 and (int(vals[0]),int(vals[1]))==(
                   idx%approved.nx+1,idx//approved.nx+1)
            assert vals[40] in (".","Missing")
          print("S4H_REAL_TWO_SS_ORIGINAL_FORTRAN_DYNAMIC_LU_38CLASS_SOURCE=PASS",
                approved.nx*approved.ny)
          PY
          (
            cd "$RUNNER_TEMP/s4h/original-makegeo-run"
            timeout 1200 "$RUNNER_TEMP/s4h/original-makegeo.x" \
              > original_stdout.log 2>&1 || {
              tail -n 80 original_stdout.log
              test ! -f original_makegeo.lst || tail -n 80 original_makegeo.lst
              exit 1
            }
            test -s original_geo.dat
          )
      - name: Independently compare every real-grid cell eight original physical MAKEGEO fields
        shell: bash
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          native="$case/geo/makegeo/p3_case"
          /usr/bin/python3 - "$case" "$native" <<'PY'
          import pathlib,subprocess,sys,json,hashlib
          from native_cpp.orchestration.case_admission import admit_case
          case,native=map(pathlib.Path,sys.argv[1:])
          approved=admit_case(case/"case.yaml")
          root=case.parent
          report=case/"evidence/s4h-original-p3-compare.json"
          args=["/usr/bin/python3","-m","native_cpp.reference.compare_p3_makegeo_dynamic",
                "--original-geo",str(root/"s4h/original-makegeo-run/original_geo.dat"),
                "--cpp-csv",str(native/"p3.csv"),"--cpp-geo",str(native/"geo.dat"),
                "--report",str(report),"--zone",str(approved.utm_zone),
                "--hem",approved.hemisphere,"--nx",str(approved.nx),
                "--ny",str(approved.ny),"--xrefkm",approved.xrefkm_text,
                "--yrefkm",approved.yrefkm_text,
                "--dgridkm",f"{approved.dgridkm:.3f}"]
          subprocess.run(args,check=True)
          proof=json.loads(report.read_text())
          p2=json.loads((case/"evidence/p2.json").read_text())
          p3=json.loads((case/"evidence/p3.json").read_text())
          source=json.loads((case/"inputs/p1_srtm90_source_window.json").read_text())
          b0=json.loads((case/"evidence/b0-real-station-grid.json").read_text())
          assert proof["status"]=="P3_NONHEFEI_ORIGINAL_MAKEGEO_PASS"
          assert proof["failures"]==0 and proof["values_compared"]==8*approved.nx*approved.ny
          assert all(m["displayed_value_mismatches"]==0 and
                     m["csv_outside_fixed_precision_tolerance"]==0
                     for m in proof["metrics"].values())
          assert p3["grid_cmn_sha256"]==p2["grid_cmn_sha256"]==b0["grid_sha256"]
          assert p3["research_time_sha256"]==p2["research_time_sha256"]==b0["research_time_sha256"]
          assert p3["case_yaml_sha256"]==p2["case_yaml_sha256"]==b0["case_yaml_sha256"]
          assert p3["p1_tif_sha256"]==source["cropped_source_sha256"]
          assert p3["p2_lu_dat_sha256"]==p2["lu_dat_sha256"]
          assert p3["geo_dat_sha256"]==proof["native_geo_sha256"]
          receipt={"status":"S4H_REAL_TWO_SS_SOURCE_GRID_P1_P2A_P3_ORIGINAL_MAKEGEO_PASS_SCOPED",
                   "grid":b0,"physics_scope":"SELECTED_ORIGINAL_NO_SNOW_38_TO_14",
                   "comparisons":proof["values_compared"],"grid_cells":approved.nx*approved.ny,
                   "fields_per_cell":8,"exceedances":proof["failures"],
                   "original_vendor_ref":"CTEAS@dfad99a78ed84d655e21411c9d25eb0d2583bf13",
                   "original_makegeo_fortran_sha256":"8c4fb11db36d4b976b54f470b7a06ce4e38ab09e934951b0e2c613bddc34e347",
                   "original_geo_sha256":proof["original_geo_sha256"],
                   "native_geo_sha256":proof["native_geo_sha256"],
                   "input_parent_srtm90_sha256":source["parent_original_tif_sha256"],
                   "input_original_glcc_sha256":p2["source_img_sha256"],
                   "P4_P5_SAME_CASE_JOINT":"NOT_RUN","G19_FULL_SOURCE":"NOT_RUN",
                   "P6_ORIGINAL_CALMET_45_FIELD":"NOT_RUN","P7":"NOT_RUN",
                   "production_admission":False}
          (case/"evidence/s4h-large-grid-p3-science-receipt.json").write_text(
                 json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print("S4H_REAL_2SS_GRID_FRESH_ORIGINAL_MAKEGEO_FIELDS_PASS_SCOPED",
                "CELLS",approved.nx*approved.ny,"COMPARED",proof["values_compared"],
                "EXCEEDANCES",proof["failures"])
          PY
      - name: Build existing P4 P5 real NOAA producers and G19 original-format source reader
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p4_read62 -B "$RUNNER_TEMP/s4i-p4" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4i-p4" --parallel 2 --target cteas_p4_read62
          cmake -S native_cpp/modules/p5_smerge -B "$RUNNER_TEMP/s4i-p5" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4i-p5" --parallel 2 --target cteas_p5_smerge
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/s4i-g19" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4i-g19" --parallel 2 --target cteas_p6g_g19_source_case_preflight
      - name: Re-acquire and preserve genuine 2022 NOAA 2SS and archived Anqing IGRA in SAME 82x85 B0
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil
          from scripts.s3f.verify_real_noaa_2022_2023_station_selection import p5_check,P5_STATIONS
          from scripts.s2g.real_noaa_native_p4_up import ORIGINAL_NOAA
          from native_cpp.modules.p5_smerge.data_prep.isd_lite_wind import filename
          from native_cpp.orchestration.case_admission import admit_case,verify_immutable
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          case=root/"s4h_huoshan_xinqiao_true_2ss_2022"
          b0=admit_case(case/"case.yaml")
          source_root=root/"s4i-real-observed-sources"
          original_proof=p5_check(source_root/"s3f_genuine_p5")
          src=source_root/"s3f_genuine_p5"
          assert (src/"grid/grid.cmn").read_bytes()==(case/"grid/grid.cmn").read_bytes()
          assert original_proof["grid_origin_km"]==["426.590","3464.125"]
          dig=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert ORIGINAL_NOAA.is_file() and not ORIGINAL_NOAA.is_symlink()
          assert dig(ORIGINAL_NOAA)=="1ac0405bf9376f8d34e01621328fa17f5f0de600afbcbf9614247ee59fbb76fb"
          archive=root/"s4i-original-igra"
          archive.mkdir()
          shutil.copyfile(ORIGINAL_NOAA,archive/ORIGINAL_NOAA.name)
          assert dig(archive/ORIGINAL_NOAA.name)==dig(ORIGINAL_NOAA)
          roles={"up_original_anqing":{"sha256":dig(ORIGINAL_NOAA)}}
          for sid in P5_STATIONS:
            for rel in (f"{sid}-2022.csv","isd_lite/"+filename(sid,2022)):
              frm=src/"surface"/rel
              dst=case/"met/surface/isd_raw"/rel
              assert frm.is_file() and not frm.is_symlink()
              dst.parent.mkdir(parents=True,exist_ok=True)
              assert not dst.exists()
              shutil.copyfile(frm,dst)
              assert dig(frm)==dig(dst)
              roles["original_noaa_"+rel]={"sha256":dig(dst),"bytes":dst.stat().st_size}
          roles["b0"]={"case":b0.case_sha256,"grid":b0.grid_sha256,
                       "time":b0.time_sha256}
          roles["real_two_ss_original_annual_counts"]=original_proof["yearly"]
          (case/"evidence/s4i-real-noaa-raw-custody.json").write_text(
              json.dumps(roles,sort_keys=True,indent=2)+"\n")
          verify_immutable(b0)
          print("S4I_TRUE_BOTH_REAL_NOAA_SURFACE_RAW_AND_ANQING_ARCHIVED_UP_SHA=PASS")
          PY
      - name: Produce true original NOAA Anqing P4 UP on same 82x85 original model B0
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          /usr/bin/python3 -m native_cpp.modules.p4_read62.data_prep.run_cpp_pipeline \
            --case-root "$case" --upperair-root "$case/met/upperair" \
            --offline-archive-root "$RUNNER_TEMP/s4i-original-igra" \
            --cpp-bin "$RUNNER_TEMP/s4i-p4/cteas_p4_read62" \
            --candidate-final --execute
          test -s "$case/met/upperair/p4_d1a_annual_manifest.json"
          echo 'S4I_REAL_SAME_CASE_ANQING_1US=PRODUCED_INPUT_ONLY'
      - name: Produce both observed actual NOAA surface station SMERGE files same case
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          /usr/bin/python3 -m native_cpp.modules.p5_smerge.data_prep.p5_case_producer \
            --case-yaml "$case/case.yaml" \
            --history-file "$GITHUB_WORKSPACE/engine/resources/isd/isd-history.txt" \
            --native-cpp-bin "$RUNNER_TEMP/s4i-p5/cteas_p5_smerge" \
            --offline-reselect
          test -s "$case/met/surface/final/surf.dat"
          echo 'S4I_REAL_SAME_CASE_HUOSHAN_LUOGANG_2SS=PRODUCED_INPUT_ONLY'
      - name: Accept actual same-B0 P1-P5 SHA while independently proving water HEATFX G19 blocks safely
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          case="$RUNNER_TEMP/s4h_huoshan_xinqiao_true_2ss_2022"
          /usr/bin/python3 -m native_cpp.orchestration.s3_five_source_preflight \
            --case-yaml "$case/case.yaml" \
            --destination "$case/evidence/s3-b0-five-source-preflight.json"
          # The original G19 full G14 scheduling constructor still restricts
          # G18D3 HFLUX to all-land. The 82x85 actual NOAA source contains
          # water. Do NOT bypass original physics or claim a G19 pass.
          set +e
          /usr/bin/python3 -m native_cpp.orchestration.s3_huoshan_g19_source_only \
            --case-yaml "$case/case.yaml" \
            --native-g19 "$RUNNER_TEMP/s4i-g19/cteas_p6g_g19_source_case_preflight" \
            > "$case/evidence/s4i-g19-native.stdout.txt" \
            2> "$case/evidence/s4i-g19-native.stderr.txt"
          rc=$?
          set -e
          if test "$rc" -eq 0; then
