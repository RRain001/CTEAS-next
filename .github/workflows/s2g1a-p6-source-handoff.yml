name: S2-G1A dynamic P6 G19 source-only handoff, no P6/P7 physics

on:
  push:
    branches: [codex/s2g1a-dynamic-p6-file-handoff]
    paths:
      - .github/workflows/s2g1a-p6-source-handoff.yml
      - native_cpp/orchestration/p6_g19_handoff.py
      - native_cpp/orchestration/tests/test_p6_g19_handoff.py
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/s2g1a-p6-source-handoff.yml
      - native_cpp/orchestration/p6_g19_handoff.py
      - native_cpp/orchestration/tests/test_p6_g19_handoff.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2g1a-source-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dynamic-station-file-contract:
    name: Dynamic case/deck/station source-only contract tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install minimal Python
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Test P6 original-source file binding (no solver execution)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q native_cpp/orchestration/p6_g19_handoff.py
          python3 -m unittest -v native_cpp.orchestration.tests.test_p6_g19_handoff
          echo 'P6D_NOT_RUN=1 P6E_NOT_RUN=1 P6F_NOT_RUN=1 P7_NOT_RUN=1'
  native-g19-original-format-parsing:
    name: Independent C++ G19 real-format GEO/SURF/UP source parser CTest
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Configure bounded source-only P6 C++ target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/p6g-g19" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build "$RUNNER_TEMP/p6g-g19" --parallel 2 \
            --target cteas_p6g_g19_file_backed_case_tests cteas_p6g_g19_source_case_preflight
      - name: Check original-format multi-station and cross-year G19 source only
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/p6g-g19" --output-on-failure -V \
            -R '^p6g_g19_source_file_backed_2ss_2us_g14_input_contract$'
          echo 'P6_NUMERICAL_45_FIELD_COMPARISON=NOT_RUN'
          echo 'P6_PHYSICS=NOT_ACCEPTED P7=NOT_RUN'
