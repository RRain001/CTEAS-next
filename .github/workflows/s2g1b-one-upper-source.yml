name: S2-G1B one-upper two-surface original-file input gates (NO native P6 physics)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2g1b-one-upper-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  one-upper-station-source-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Dependencies
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Run P6 G19 dynamic input-only tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v native_cpp.orchestration.tests.test_p6_g19_handoff
          echo 'STATION_SHAPE=2SS_1US_SOURCE_ONLY'
          echo 'P6D_NOT_RUN=1 P6E_NOT_RUN=1 P6F_NOT_RUN=1 P7_NOT_RUN=1'
  cpp-real-original-format-case-parser:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile independent bounded G19 source-only input C++ targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/p6g-g19-1us" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build "$RUNNER_TEMP/p6g-g19-1us" --parallel 2 \
            --target cteas_p6g_g19_file_backed_case_tests cteas_p6g_g19_source_case_preflight
      - name: Real-format cross-year 2SS/1US source parsing, NEARU and negative inputs
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir "$RUNNER_TEMP/p6g-g19-1us" -V --output-on-failure \
            -R '^p6g_g19_source_file_backed_2ss_2us_g14_input_contract$' \
            | tee "$RUNNER_TEMP/p6g_g1b_cpp_source_only.log"
          grep -q 'PASS_P6G_G19_FILE_BACKED_2SS_1US_CROSS_YEAR_SOURCE_INPUT' \
            "$RUNNER_TEMP/p6g_g1b_cpp_source_only.log"
          grep -q 'PASS_P6G_G19_FILE_BACKED_2SS_2US_CROSS_YEAR_SOURCE_INPUT' \
            "$RUNNER_TEMP/p6g_g1b_cpp_source_only.log"
          echo 'P6_45_FIELD_ORIGINAL_PARITY=NOT_RUN P6_PHYSICS=NOT_ACCEPTED P7=NOT_RUN'
