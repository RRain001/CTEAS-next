name: Manually review and prune obsolete branches

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preview (no deletions) or apply"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - apply
      batch:
        description: 'standard / reviewed second pass / issue54 scratch retirement'
        required: true
        default: standard
        type: choice
        options:
          - standard
          - second_pass_20261019
          - retire_issue54_20261019
      confirmation:
        description: 'For apply, enter the batch-specific confirmation string'
        required: false
        type: string
      max_delete:
        description: 'Maximum branches deleted per run (1-200)'
        required: true
        default: "200"
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    name: Audited branch cleanup (manual only)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CLEANUP_MODE: ${{ inputs.mode }}
      CLEANUP_BATCH: ${{ inputs.batch }}
      CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
      CLEANUP_MAX: ${{ inputs.max_delete }}
    steps:
      - name: Checkout reviewed roster and archived sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Inventory, verify, and optionally delete safe branches
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const repoFull = owner + '/' + repo;
            const mode = process.env.CLEANUP_MODE;
            const batch = process.env.CLEANUP_BATCH || 'standard';
            const confirmation = process.env.CLEANUP_CONFIRMATION;
            const maxDelete = Number(process.env.CLEANUP_MAX);
            if (context.ref !== 'refs/heads/main') throw new Error('ONLY_MAIN_DISPATCH_ALLOWED');
            if (!['preview', 'apply'].includes(mode)) throw new Error('INVALID_MODE');
            if (!['standard', 'second_pass_20261019', 'retire_issue54_20261019'].includes(batch)) throw new Error('INVALID_BATCH');
            if (!Number.isInteger(maxDelete) || maxDelete < 1 || maxDelete > 200) throw new Error('INVALID_MAX_DELETE');
            const requiredConfirmation = batch === 'second_pass_20261019'
              ? 'DELETE_SECOND_PASS_20261019'
              : batch === 'retire_issue54_20261019'
                ? 'DELETE_ISSUE54_SCRATCH_3626a057'
                : 'DELETE_REVIEWED_BRANCHES';
            if (mode === 'apply' && confirmation !== requiredConfirmation) {
              throw new Error('APPLY_REQUIRES_EXACT_CONFIRMATION_' + requiredConfirmation);
            }

            // Second-pass deletion uses only reviewed exact SHA; no wildcard matching.
            const alwaysKeep = new Set([
              'main',
              'codex/issue123-d3-full4-provenance-and-optin-count',
              'codex/issue123-original-sampling-coastal-policy-d0',
              'codex/issue84-wolsong-real-zero-leap-parity'
            ]);
            if (batch !== 'retire_issue54_20261019') {
              alwaysKeep.add('feat/issue54-scratch-native-cpp-pixel-lineage');
            }
            if (batch === 'standard') {
              alwaysKeep.add('maintenance/manual-reviewed-branch-prune-20261019');
            }
            const pinned = new Map();
            let manifestSha256 = null;
            let archivedSourceCount = 0;
            let archives = [];
            if (batch === 'second_pass_20261019') {
              const text = fs.readFileSync('.github/maintenance/second-pass-20261019.json', 'utf8');
              manifestSha256 = crypto.createHash('sha256').update(text).digest('hex');
              const manifest = JSON.parse(text);
              if (manifest.schema !== 'CTEAS_NEXT_REVIEWED_BRANCH_PRUNE_V2' ||
                  manifest.repository !== repoFull || manifest.expected_count !== 23 ||
                  !Array.isArray(manifest.branches) || manifest.branches.length !== 23 ||
                  !Array.isArray(manifest.source_archives) ||
                  manifest.source_archives.length !== 6) {
                throw new Error('REVIEWED_MANIFEST_INVALID');
              }
              for (const b of manifest.branches) {
                if (!b.name || !/^[a-f0-9]{40}$/.test(b.head_sha) || pinned.has(b.name)) {
                  throw new Error('REVIEWED_MANIFEST_DUPLICATE_OR_INVALID_SHA');
                }
                if (alwaysKeep.has(b.name) || b.name === 'main') {
                  throw new Error('REVIEWED_MANIFEST_INCLUDES_PROTECTED_NAME');
                }
                pinned.set(b.name, b.head_sha);
              }
              archives = manifest.source_archives;
              const coverage = new Set();
              for (const archive of archives) {
                if (!/^docs\/maintenance\/branch-prune-20261019\/[a-z0-9-]+-sources\.json$/.test(archive)) {
                  throw new Error('REVIEWED_ARCHIVE_PATH_INVALID');
                }
                const source = JSON.parse(fs.readFileSync(archive, 'utf8'));
                if (source.schema !== 'CTEAS_NEXT_BRANCH_SOURCE_ARCHIVE_V1' ||
                    !Array.isArray(source.files) || source.files.length === 0) {
                  throw new Error('REVIEWED_ARCHIVE_MISSING_OR_INVALID');
                }
                for (const f of source.files) {
                  if (pinned.get(f.branch) !== f.head_sha ||
                      !/^\.github\/(workflows\/|science-triggers\/)/.test(f.path)) {
                    throw new Error('REVIEWED_ARCHIVE_SOURCE_MISMATCH');
                  }
                  const body = Buffer.from(f.source, 'utf8');
                  const digest = crypto.createHash('sha1')
                    .update('blob ' + body.length + '\0').update(body).digest('hex');
                  if (digest !== f.blob_sha) throw new Error('REVIEWED_ARCHIVE_BLOB_MISMATCH');
                  archivedSourceCount += 1;
                  coverage.add(f.branch);
                }
              }
              for (const name of pinned.keys()) {
                if (name.startsWith('automation/') && !coverage.has(name)) {
                  throw new Error('REVIEWED_ARCHIVE_INCOMPLETE_' + name);
                }
              }
              if (mode === 'apply' && maxDelete < pinned.size) {
                throw new Error('MAX_DELETE_TOO_LOW_FOR_REVIEWED_BATCH');
              }
            }
            if (batch === 'retire_issue54_20261019') {
              const name = 'feat/issue54-scratch-native-cpp-pixel-lineage';
              const sha = '3626a05705a8a6d4cad52fe3aa19a723f9c57ecb';
              const archive = 'docs/maintenance/branch-retirements/issue54-scratch-20261019-sources.json';
              const raw = fs.readFileSync(archive, 'utf8');
              const record = JSON.parse(raw);
              if (record.schema !== 'CTEAS_NEXT_RETIRED_BRANCH_ARCHIVE_V1' ||
                  record.repository !== repoFull ||
                  record.branch !== name || record.head_sha !== sha ||
                  !Array.isArray(record.files) || record.files.length !== 5) {
                throw new Error('ISSUE54_RETIREMENT_ARCHIVE_INVALID');
              }
              const paths = new Set();
              for (const f of record.files) {
                if (typeof f.path !== 'string' || typeof f.source !== 'string' ||
                    !/^[a-f0-9]{40}$/.test(f.blob_sha) || paths.has(f.path)) {
                  throw new Error('ISSUE54_RETIREMENT_INVALID_SOURCE');
                }
                paths.add(f.path);
                const data = Buffer.from(f.source, 'utf8');
                const hash = crypto.createHash('sha1')
                  .update('blob ' + data.length + '\0').update(data).digest('hex');
                if (hash !== f.blob_sha) throw new Error('ISSUE54_RETIREMENT_BLOB_MISMATCH');
              }
              if (!paths.has('scripts/s2g/p1_original_cpp_probe.py') ||
                  !paths.has('scripts/s2g/tests/test_p1_original_cpp_probe.py') ||
                  !paths.has('docs/plans/ISSUE54_DIRECT_NATIVE_CPP_PIXEL_LINEAGE_20261018.md')) {
                throw new Error('ISSUE54_RETIREMENT_SCRATCH_EVIDENCE_MISSING');
              }
              manifestSha256 = crypto.createHash('sha256').update(raw).digest('hex');
              archivedSourceCount = record.files.length;
              archives = [archive];
              pinned.set(name, sha);
            }
            // Individually reviewed closed-unmerged PRs whose successors were merged.
            const superseded = new Map([[20, 19], [32, 31]]);
            const branches = await github.paginate(github.rest.repos.listBranches,
              {owner, repo, per_page: 100});
            const pulls = await github.paginate(github.rest.pulls.list,
              {owner, repo, state: 'all', per_page: 100});
            const successorIsMerged = new Map();
            for (const [oldNumber, newNumber] of superseded) {
              const successor = pulls.find(p => p.number === newNumber);
              successorIsMerged.set(oldNumber, !!(successor && successor.merged_at));
            }
            const byBranch = new Map();
            for (const p of pulls) {
              if (!p.head || !p.head.repo || p.head.repo.full_name !== repoFull) continue;
              const arr = byBranch.get(p.head.ref) || [];
              arr.push(p);
              byBranch.set(p.head.ref, arr);
            }
            // Fail before any deletion if any of the 23 pinned refs changed or acquired a PR.
            if (batch !== 'standard' && mode === 'apply') {
              const observed = new Map(branches.map(b => [b.name, b]));
              for (const [name, sha] of pinned) {
                const live = observed.get(name);
                const linked = byBranch.get(name) || [];
                if (!live || live.protected || live.commit.sha !== sha ||
                    linked.some(p => p.state === 'open') ||
                    linked.some(p => !p.merged_at)) {
                  throw new Error('REVIEWED_BATCH_STALE_OR_UNSAFE_' + name);
                }
              }
            }
            const report = [];
            let removed = 0;
            for (const b of branches) {
              const linked = byBranch.get(b.name) || [];
              let reason = '';
              let safe = false;
              const reviewedSha = batch !== 'standard' ? pinned.get(b.name) : null;
              if (batch !== 'standard' && !reviewedSha) {
                reason = 'outside-reviewed-second-pass';
              } else if (b.protected || alwaysKeep.has(b.name)) {
                reason = 'protected-or-explicit-keep';
              } else if (reviewedSha && reviewedSha !== b.commit.sha) {
                reason = 'reviewed-sha-changed';
              } else if (linked.some(p => p.state === 'open')) {
                reason = 'open-pr';
              } else if (batch !== 'standard') {
                if (linked.some(p => !p.merged_at)) {
                  reason = 'closed-unmerged-pr';
                } else {
                  safe = true;
                  reason = 'reviewed-second-pass-exact-sha';
                }
              } else if (linked.some(p => !p.merged_at && !(
                superseded.has(p.number) && successorIsMerged.get(p.number)
              ))) {
                reason = 'closed-unmerged-pr-without-reviewed-successor';
              } else {
                const mergedExact = linked.some(p => !!p.merged_at &&
                  p.head.sha === b.commit.sha);
                const supersededExact = linked.some(p => !p.merged_at &&
                  superseded.has(p.number) && successorIsMerged.get(p.number) &&
                  p.head.sha === b.commit.sha);
                if (mergedExact) {
                  safe = true;
                  reason = 'exact-tip-of-merged-pr';
                } else if (supersededExact) {
                  safe = true;
                  reason = 'reviewed-superseded-pr';
                } else {
                  try {
                    const compare = await github.rest.repos.compareCommitsWithBasehead(
                      {owner, repo, basehead: 'main...' + b.name});
                    if (compare.data.ahead_by === 0) {
                      safe = true;
                      reason = 'branch-tip-already-ancestor-of-main';
                    } else {
                      reason = 'unmerged-commits-ahead-' + compare.data.ahead_by;
                    }
                  } catch (error) {
                    reason = 'comparison-failed-' + (error.status || 'unknown');
                  }
                }
              }
              let action = safe ? 'CANDIDATE' : 'KEEP';
              if (safe && mode === 'apply') {
                if (removed >= maxDelete) {
                  action = 'SKIP_LIMIT';
                } else {
                  try {
                    const current = await github.rest.repos.getBranch(
                      {owner, repo, branch: b.name});
                    if (current.data.commit.sha !== b.commit.sha || current.data.protected) {
                      action = 'SKIP_MOVED_OR_PROTECTED';
                    } else {
                      await github.rest.git.deleteRef(
                        {owner, repo, ref: 'heads/' + b.name});
                      action = 'DELETED';
                      removed += 1;
                    }
                  } catch (error) {
                    action = 'FAILED_' + (error.status || 'unknown');
                  }
                }
              }
              report.push({
                branch: b.name, head_sha: b.commit.sha,
                expected_sha: batch !== 'standard' ? pinned.get(b.name) || null : null,
                action, reason, linked_prs: linked.map(p => p.number)
              });
              core.info(action + ' | ' + b.name + ' | ' + reason);
            }
            const output = {
              schema: 'CTEAS_NEXT_BRANCH_CLEANUP_V2',
              repository: repoFull,
              mode, batch, manifest_sha256: manifestSha256,
              source_archive_files: archives,
              archived_source_count: archivedSourceCount,
              main_sha: (await github.rest.repos.getBranch(
                {owner, repo, branch: 'main'})).data.commit.sha,
              branch_count_before: branches.length,
              safe_candidate_count: report.filter(x =>
                x.action === 'CANDIDATE' || x.action === 'DELETED' ||
                x.action === 'SKIP_LIMIT').length,
              deleted_count: removed, entries: report
            };
            const dst = path.join(process.env.RUNNER_TEMP, 'branch-cleanup-report.json');
            fs.writeFileSync(dst, JSON.stringify(output, null, 2) + '\n');
            await core.summary.addHeading('CTEAS-next remote branch cleanup');
            await core.summary.addRaw('Mode: ' + mode + '; batch: ' + batch +
              '; branches: ' + branches.length + '; removed: ' + removed +
              '; archive sources: ' + archivedSourceCount + '\n\n');
            await core.summary.addTable([
              [{data:'Branch',header:true},{data:'Action',header:true},{data:'Reason',header:true}],
              ...report.map(r => [r.branch, r.action, r.reason])
            ]);
            await core.summary.write();
            if (report.some(x => x.action.startsWith('FAILED_'))) {
              core.setFailed('One or more branch deletions failed; inspect artifact');
            }
      - name: Upload independently inspectable branch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-cleanup-report
          retention-days: 30
          if-no-files-found: warn
          path: ${{ runner.temp }}/branch-cleanup-report.json
