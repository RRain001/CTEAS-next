name: Issue119 Wolsong real GSHHG coast preflight and P2-B (manual only)
on:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: "Coastline-only first; full_p2b needs local authenticated GLC acquisition"
        required: true
        type: choice
        options: [coastline_only, full_p2b]
        default: coastline_only
permissions:
  contents: read
concurrency:
  group: issue119-wolsong-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wolsong-2022-real:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install GDAL/GEOS and native prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-rasterio python3-pyproj python3-numpy python3-gdal gdal-bin libgdal-dev libssl-dev cmake g++-12
      - name: Restore official verified GSHHG Full L1 (no unverified mirror)
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.gshhg_v237_cache fetch --source project-release --cache "${RUNNER_TEMP}/gshhg/2.3.7"
          python3 -m scripts.s2g.gshhg_v237_cache verify --cache "${RUNNER_TEMP}/gshhg/2.3.7"
      - name: Test Wolsong true coastal crossing independently of GLC
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/wolsong-evidence"
          /usr/bin/python3 -m scripts.s2g.p2b_wolsong_case coast \
            --gshhs-shp "${RUNNER_TEMP}/gshhg/2.3.7/GSHHS_f_L1/GSHHS_f_L1.shp" \
            --report "${RUNNER_TEMP}/wolsong-evidence/coast_utm52n.json"
      - name: Verify actual Wolsong 2022 GLC full-area input (no EE in Actions)
        if: ${{ inputs.validation_scope == 'full_p2b' }}
        run: |
          set -euo pipefail
          DIR=data/landcover/glc_fcs30d/v1_2022/wolsong
          if [ ! -s "$DIR/wolsong_2022_30m.tif" ] || [ ! -s "$DIR/metadata.json" ]; then
            echo 'BLOCKED_WOLSONG_GLC_NOT_ACQUIRED: obtain with local user-authenticated python3 -m scripts.s2g.p2b_wolsong_case download; commit TIFF + metadata'
            exit 2
          fi
          /usr/bin/python3 -m scripts.s2g.p2b_wolsong_case verify
      - name: Build existing P2-B C++ area kernel
        if: ${{ inputs.validation_scope == 'full_p2b' }}
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/wolsong-cpp" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/wolsong-cpp" --parallel 2 --target cteas_p2_glc_lu_dat
      - name: Real GLC210 to USGS52/55 and LU.DAT science gates
        if: ${{ inputs.validation_scope == 'full_p2b' }}
        run: |
          set -euo pipefail
          TIF=data/landcover/glc_fcs30d/v1_2022/wolsong/wolsong_2022_30m.tif
          SHP="${RUNNER_TEMP}/gshhg/2.3.7/GSHHS_f_L1/GSHHS_f_L1.shp"
          POLICY=docs/plans/ISSUE53_GLC35_USGS38_USER_SELECTED_20261019.json
          "${RUNNER_TEMP}/wolsong-cpp/cteas_p2_glc_lu_dat" \
            "$TIF" "$(sha256sum "$TIF" | cut -d' ' -f1)" \
            "$SHP" "$(sha256sum "$SHP" | cut -d' ' -f1)" \
            "$POLICY" "$(sha256sum "$POLICY" | cut -d' ' -f1)" \
            "${RUNNER_TEMP}/wolsong-p2b-real" 32652 533.215 3942.629 0.100 200 200
          /usr/bin/python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          coast=json.loads((root/'wolsong-evidence/coast_utm52n.json').read_text())
          source=json.loads(Path('data/landcover/glc_fcs30d/v1_2022/wolsong/metadata.json').read_text())
          out=root/'wolsong-p2b-real'
          m=json.loads((out/'p2_b_d3_manifest.json').read_text())
          assert coast['status']=='CROSSES_COAST'
          assert 0<coast['union_land_area_m2']<400_000_000
          assert source['modelgrid_coverage_ok'] and source['glc210_coverage_ok']
          assert abs(source['modelgrid_valid_source_area_m2']-400_000_000)<.02
          assert m['n_cells']==40000 and m['n_usgs_classes']==38
          assert m['glc_tif_sha256']==source['sha256']
          assert m['max_fraction_sum_error']<1e-9
          assert m['usgs55_ocean_water_area_m2']>0
          assert m['usgs52_inland_water_area_m2']>=0
          lines=(out/'lu.dat').read_text().splitlines()
          assert len(lines)==40011
          categories=list(map(int,lines[10].split()))
          assert len(categories)==38
          count_mixed=0
          worst=0.
          for line in lines[11:]:
            v=line.split()
            assert len(v)==41 and v[-1]=='.'
            f=list(map(float,v[2:-1]))
            count_mixed+=(f[categories.index(52)]>0 and f[categories.index(55)]>0)
            worst=max(worst,abs(sum(f)-1.))
          assert worst<=.02
          result={'status':'P2B_WOLSONG_REAL_COASTAL_ENGINEERING_PASS_SCOPED',
                  'glc_sha256':source['sha256'],
                  'gshhg_full_l1_sha256':coast['source_shp_sha256'],
                  'lu_dat_sha256':m['lu_dat_sha256'],
                  'water52_m2':m['usgs52_inland_water_area_m2'],
                  'water55_m2':m['usgs55_ocean_water_area_m2'],
                  'mixed_display_cells':count_mixed,
                  'max_display_fraction_sum_error':worst,
                  'p3_original_parity':'NOT_RUN',
                  'full_vs_high_shoreline':'NOT_RUN',
                  'shoreline_2017_2022_accuracy':'NOT_VERIFIED'}
          (out/'wolsong_evidence.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - name: Extract verified GSHHG High L1 from the exact official v2.3.7 archive
        if: ${{ inputs.validation_scope == 'full_p2b' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from scripts.s2g import gshhg_v237_cache
          cache=Path(os.environ['RUNNER_TEMP'])/'gshhg/2.3.7'
          gshhg_v237_cache.verify(cache)  # Strict official ZIP and Full L1 sidecar SHA
          high=cache/'GSHHS_h_L1'
          high.mkdir(exist_ok=False)
          with ZipFile(cache/'gshhg-shp-2.3.7.zip') as z:
              for ext in ('.shp','.shx','.dbf','.prj'):
                  suffix='GSHHS_shp/h/GSHHS_h_L1'+ext
                  items=[i for i in z.infolist() if i.filename.endswith(suffix)]
                  if len(items)!=1 or not 0<items[0].file_size<300*1024*1024:
                      raise RuntimeError('VERIFIED_GSHHG_HIGH_L1_MEMBER_MISSING_OR_OVERSIZE:'+ext)
                  (high/('GSHHS_h_L1'+ext)).write_bytes(z.read(items[0]))
          print('GSHHG_HIGH_L1=EXTRACTED_FROM_SHA_VERIFIED_OFFICIAL_V237_ARCHIVE')
          PY
      - name: Audit 222 52/55 mixed cells with independent GSHHG Full/High geometry
        if: ${{ inputs.validation_scope == 'full_p2b' }}
        run: |
          set -euo pipefail
          /usr/bin/python3 -m scripts.s2g.p2b_wolsong_mixed_coast_audit \
            --tif data/landcover/glc_fcs30d/v1_2022/wolsong/wolsong_2022_30m.tif \
            --lu-dat "${RUNNER_TEMP}/wolsong-p2b-real/lu.dat" \
            --full-shp "${RUNNER_TEMP}/gshhg/2.3.7/GSHHS_f_L1/GSHHS_f_L1.shp" \
            --high-shp "${RUNNER_TEMP}/gshhg/2.3.7/GSHHS_h_L1/GSHHS_h_L1.shp" \
            --out "${RUNNER_TEMP}/wolsong-evidence/mixed-geo-audit"
          echo "P2B_52_55_MIXED_GEOMETRY=AUDITED_SCOPED; 2022_OBSERVED_SHORELINE=NOT_VERIFIED; P3=NOT_RUN"
      - name: Preserve real coast diagnostic even if later stages blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue119-wolsong-real-coast
          path: |
            ${{ runner.temp }}/wolsong-evidence/coast_utm52n.json
            ${{ runner.temp }}/wolsong-evidence/mixed-geo-audit/mixed_52_55_cells.csv
            ${{ runner.temp }}/wolsong-evidence/mixed-geo-audit/mixed_52_55_audit.json
            ${{ runner.temp }}/wolsong-p2b-real/p2_b_d3_manifest.json
            ${{ runner.temp }}/wolsong-p2b-real/lu.dat
            ${{ runner.temp }}/wolsong-p2b-real/wolsong_evidence.json
          if-no-files-found: warn
