name: S2-G1B-B3 GLCC source-only UTM crop contract (no native P2 physics)

on:
  push:
    branches: [codex/s2g1bb3-glcc-from-grid-source-only]
    paths:
      - .github/workflows/s2g1bb3-glcc-source.yml
      - scripts/s2g/real_glcc_landuse_from_grid.py
      - scripts/s2g/tests/test_real_glcc_landuse_from_grid.py
      - docs/s2g1bb3_p1_p2_sources.md
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/s2g1bb3-glcc-source.yml
      - scripts/s2g/real_glcc_landuse_from_grid.py
      - scripts/s2g/tests/test_real_glcc_landuse_from_grid.py
      - docs/s2g1bb3_p1_p2_sources.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2g1bb3-glcc-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-original-layout-input-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Install geospatial source adapter dependencies
        run: python3 -m pip install --disable-pip-version-check 'rasterio>=1.3,<2' 'numpy>=1.23,<3'
      - name: Run source-only GLCC 24-to-38 and anti-LFS-pointer tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/s2g/real_glcc_landuse_from_grid.py
          python3 -m unittest -v scripts.s2g.tests.test_real_glcc_landuse_from_grid
          echo 'GLCC_LAYOUT_SYNTHETIC_TESTS=PASS'
          echo 'ORIGINAL_REAL_LFS_GEO=NOT_DOWNLOADED'
          echo 'P2_NATIVE_LU=NOT_RUN P3_GEO=NOT_RUN P6=NOT_RUN'

  manual-real-user-lfs-source:
    name: Manual genuine 156MB GLCC LFS data verification (no P2 physics)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: true
      - name: Dependencies
        run: python3 -m pip install --disable-pip-version-check 'rasterio>=1.3,<2' 'numpy>=1.23,<3'
      - name: Verify full real user-provided source SHA and extract actual Hefei grid window
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.real_glcc_landuse_from_grid \
            --grid project/cases/hefei5km_2022_reference_case_20261011/grid/grid.cmn \
            --landuse-file eausgs2_0la.img \
            --out-dir "$RUNNER_TEMP/p2-genuine-glcc-hefei-source" \
            --mesh-cells 20 \
            > "$RUNNER_TEMP/glcc-source-evidence.json"
          python3 - "$RUNNER_TEMP/glcc-source-evidence.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1]))
          assert p["original_sha256"]=="4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a"
          assert p["original_size_bytes"]==156000000 and p["classified_pixels"]>0
          assert p["generic"]["n_points"]==p["output_points_estimated"]
          assert p["native_P2_lu_dat"]=="NOT_RUN" and p["native_P3_geo_dat"]=="NOT_RUN"
          print("REAL_ROOT_LFS_GLCC=PASS_HEFEI_INPUT_SOURCE_ONLY; P2/P3_PHYSICS=NOT_RUN")
          PY
      - name: Save source manifest only, never the 156MB raw imagery
        uses: actions/upload-artifact@v4
        with:
          name: real-lfs-glcc-source-sha-only
          path: ${{ runner.temp }}/p2-genuine-glcc-hefei-source/glcc_source_manifest.json
          if-no-files-found: error
