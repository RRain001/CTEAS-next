name: Issue46 P3 dynamic MAKEGEO contract (software only)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - native_cpp/src/p3_makegeo_cli.cpp
      - native_cpp/p3/**
      - native_cpp/include/cteas/geo/grid_origin.hpp
      - docs/plans/ISSUE46_P3_D1A_DYNAMIC_MAKEGEO_20261019.md
      - .github/workflows/issue46-p3-dynamic-software-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p3-ctest:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install isolated software toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++-12 python3
      - name: Build selected C++ P3/adapter (no Fortran, DEM or NOAA)
        run: |
          set -euo pipefail
          cmake -S native_cpp/p3 -B "${RUNNER_TEMP}/issue46-p3" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/issue46-p3" --parallel 2
      - name: Frozen Hefei and dynamic 4x3 software regression
        run: |
          set -euo pipefail
          ctest --test-dir "${RUNNER_TEMP}/issue46-p3" --output-on-failure
          echo 'P3_DYNAMIC_D1A=PASS_SOFTWARE_ONLY NONHEFEI_ORIGINAL_SCIENCE=NOT_RUN P1_P2_GENERIC_HANDOFF=NOT_RUN'
