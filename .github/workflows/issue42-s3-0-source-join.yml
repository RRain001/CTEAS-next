name: Issue42 S3-0 common five source SHA preflight software
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-producer-readonly-join-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Install existing B0 admission dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-yaml python3-pyproj
      - name: Run B0 and cross-producer SHA/clock/station negative software gates
        run: |
          set -euo pipefail
          /usr/bin/python3 -m compileall -q native_cpp/orchestration/s3_five_source_preflight.py
          /usr/bin/python3 -m unittest -v \
            native_cpp.orchestration.tests.test_s3_five_source_preflight \
            native_cpp.orchestration.tests.test_case_admission
          echo 'S3_B0_FIVE_PRODUCER_SOURCE_JOIN_SOFTWARE=PASS'
          echo 'S3_REAL_FIVE_PRODUCT_SAME_SITE=NOT_RUN G19_NATIVE_SOURCE=NOT_RUN'
