name: S2-G0 non-Hefei native case and original NOAA station handoff (P6/P7 blocked)

on:
  push:
    branches:
      - codex/s2g-new-site-selection-handoff
    paths:
      - .github/workflows/s2g-nonhefei-site-contract.yml
      - native_cpp/orchestration/site_plan.py
      - native_cpp/orchestration/tests/test_site_plan.py
      - scripts/s2g/**
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/s2g-nonhefei-site-contract.yml
      - native_cpp/orchestration/site_plan.py
      - native_cpp/orchestration/tests/test_site_plan.py
      - scripts/s2g/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s2g-site-only-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  case-contract-software-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Python dependencies (no native solver)
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Unit and denial tests (no simulation)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s native_cpp/orchestration/tests -p 'test_*.py' -v
          python3 -m compileall -q native_cpp/orchestration/site_plan.py scripts/s2g/real_noaa_site_handoff.py
  authentic-original-noaa-shared-site-handoff:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install original-source selector dependencies (no model binaries)
        run: python3 -m pip install --disable-pip-version-check 'numpy>=1.23,<3' 'pandas>=1.5,<3' 'PyYAML>=6,<7'
      - name: Execute genuine NOAA P4/P5 selector and static non-Hefei input contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/s2g-evidence"
          printf 'SHA=%s\nP6=NOT_RUN\nP7=NOT_RUN\nG5=NOT_RUN\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/s2g-evidence/source.txt"
          python3 -u scripts/s2g/real_noaa_site_handoff.py \
            "$RUNNER_TEMP/s2g-evidence/real-noaa-input-contract.json" \
            2>&1 | tee "$RUNNER_TEMP/s2g-evidence/source-selector.log"
          grep -q 'S2G_NONHEFEI_REAL_NOAA_STATION_HANDOFF_PASS_SCOPED' "$RUNNER_TEMP/s2g-evidence/source-selector.log"
      - name: Upload JSON/logs only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s2g-real-noaa-nonhefei-handoff
          path: ${{ runner.temp }}/s2g-evidence/
          if-no-files-found: warn
