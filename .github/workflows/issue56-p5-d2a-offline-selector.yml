name: Issue 56 P5 D2-A offline original station selection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-selector-software-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install bounded validator dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Check original station selection without network
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v native_cpp.modules.p5_smerge.data_prep.tests.test_p5_offline_selector
          python3 -m unittest -v native_cpp.modules.p5_smerge.data_prep.tests.test_p5_case_producer
          python3 -m unittest -v native_cpp.modules.p5_smerge.data_prep.tests.test_case_archive_gate
          echo 'P5_D2A_OFFLINE_SELECTOR=PASS_SCOPED_SOFTWARE'
          echo 'P5_NEW_REAL_SITE_SURF=NOT_RUN P5_ORIGINAL_PARITY=NOT_RUN'
