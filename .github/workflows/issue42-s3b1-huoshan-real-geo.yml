      - name: S3-B5 stage authentic archived NOAA original POR and ISD+Lite source under same June case
        if: matrix.period == 'jun_24h'
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          from scripts.s2g.real_noaa_native_p4_up import ORIGINAL_NOAA
          from scripts.s3f.verify_real_noaa_2022_2023_station_selection import HEFEI
          from native_cpp.modules.p5_smerge.data_prep.isd_lite_wind import filename,lite_time_coverage
          from native_cpp.modules.p5_smerge.data_prep.download_isd_by_grid import original_coverage
          from native_cpp.orchestration.case_admission import admit_case,verify_immutable
          case=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022"
          b0=admit_case(case/"case.yaml")
          assert (b0.research_begin,b0.research_end)==("20220601-000000","20220602-000000")
          archive=Path(os.environ["RUNNER_TEMP"])/"s3-genuine-igra"
          archive.mkdir(exist_ok=False)
          sources={
            "p4_original_igra_anqing_2022":(ORIGINAL_NOAA,archive/ORIGINAL_NOAA.name),
            "p5_original_full_isd_luogang_2022":(
              HEFEI/"met/surface/isd_raw/58321099999-2022.csv",
              case/"met/surface/isd_raw/58321099999-2022.csv"),
            "p5_original_isd_lite_luogang_2022":(
              HEFEI/"met/surface/isd_raw/isd_lite"/filename("58321099999",2022),
              case/"met/surface/isd_raw/isd_lite"/filename("58321099999",2022)),
          }
          def digest(path):
            h=hashlib.sha256()
            with path.open("rb") as f:
              for block in iter(lambda:f.read(1<<20),b""): h.update(block)
            return h.hexdigest()
          entries={}
          for role,(src,dst) in sources.items():
            assert src.is_file() and not src.is_symlink() and src.stat().st_size>10000,(role,str(src))
            dst.parent.mkdir(parents=True,exist_ok=True)
            assert not dst.exists()
            shutil.copyfile(src,dst)
            assert digest(src)==digest(dst),role
            entries[role]={"source_path_in_repo":str(src.relative_to(HEFEI.parents[2])),
                           "sha256":digest(dst),"original_bytes":src.stat().st_size}
          full,expected=original_coverage(sources["p5_original_full_isd_luogang_2022"][1],2022,"58321099999")
          lite,le=lite_time_coverage(sources["p5_original_isd_lite_luogang_2022"][1],2022,"58321099999")
          assert expected==le==8760 and full*10>expected*9 and lite*10>expected*9
          entries["p5_luogang_original_2022_annual_hours"]={"full":full,"lite":lite,"denominator":expected}
          entries["b0"]={"case_yaml_sha256":b0.case_sha256,"grid_cmn_sha256":b0.grid_sha256,
                         "research_time_sha256":b0.time_sha256}
          verify_immutable(b0)
          out=case/"evidence/s3-b5-original-noaa-source-custody.json"
          assert not out.exists()
          out.write_text(json.dumps(entries,sort_keys=True,indent=2)+"\n")
          print("S3_B5_GENUINE_NOAA_ORIGINAL_SOURCE_SHA_AND_ANNUAL_RAW_COVERAGE=PASS_SCOPED")
          PY
