name: Issue42 S3-B1/B2 authentic Huoshan true source and original MAKEGEO numerical science
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/issue42-s3b1-huoshan-real-geo.yml
      - native_cpp/orchestration/p2a_case_producer.py
      - native_cpp/orchestration/p3_case_handoff.py
      - native_cpp/orchestration/case_admission.py
      - docs/plans/ISSUE42_S3_B1_HUOSHAN_REAL_SOURCE_20261020.md
      - scripts/s2g/issue42_s3_b1_true_srtm_window.py
      - native_cpp/reference/compare_p3_makegeo_dynamic.py
      - scripts/s2g/issue42_s3b4_real_noaa_station_probe.py
      - docs/plans/ISSUE42_S3_B5_REAL_NOAA_PRODUCERS_20261020.md
      - docs/plans/ISSUE42_S3_B2_HUOSHAN_ORIGINAL_MAKEGEO_20261020.md
      - docs/plans/ISSUE42_S3_B3_HUOSHAN_NOAA_WINDOW_20261020.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue42-s3b1-huoshan-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  genuine-huoshan-utm50-terrel-glcc-makegeo:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        period: [jan_48h, jun_24h]
    env:
      S3_RESEARCH_BEGIN: ${{ matrix.period == 'jan_48h' && '20220101-000000' || '20220601-000000' }}
      S3_RESEARCH_END: ${{ matrix.period == 'jan_48h' && '20220103-000000' || '20220602-000000' }}
    steps:
      - name: Checkout true SRTM 90m and original GLCC via LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Checkout exactly pinned original Fortran MAKEGEO separately from C++ build
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: engine/vendor/src/MAKEGEO_V3.2_L110401
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: Install approved original native build and independent grid dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++-12 gfortran cmake libgdal-dev libssl-dev python3-gdal python3-rasterio python3-numpy python3-yaml python3-pyproj python3-pandas
      - name: Admit genuine SHA-verified already tracked SRTM90 and 156MB GLCC
        run: |
          set -euo pipefail
          srtm=calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif
          glcc=eausgs2_0la.img
          test "$(wc -c < "$srtm")" -eq 72096675
          test "$(wc -c < "$glcc")" -eq 156000000
          echo "913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4  $srtm" | sha256sum -c -
          echo "4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a  $glcc" | sha256sum -c -
          /usr/bin/python3 - <<'PY'
          from osgeo import gdal,osr
          d=gdal.Open("calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif")
          assert d is not None and (d.RasterXSize,d.RasterYSize,d.RasterCount)==(6000,6000,1)
          gt=d.GetGeoTransform()
          assert gt[0]==115 and gt[3]==35 and abs(gt[1]-1/1200)<1e-8 and abs(gt[5]+1/1200)<1e-8
          assert gt[2]==gt[4]==0
          reference=osr.SpatialReference()
          assert reference.ImportFromEPSG(4326)==0
          actual=osr.SpatialReference(wkt=d.GetProjection())
          assert bool(actual.IsSame(reference))
          print("S3_HUOSHAN_P1_REAL_SRTM90_GENUINE_SOURCE_SHA_AND_CRS=PASS")
          PY
      - name: Build only existing original-style C++ P1 P2A and P3 targets
        run: |
          set -euo pipefail
          cmake -S native_cpp/p1 -B "$RUNNER_TEMP/s3-p1" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p1" --parallel 2 --target cteas_p1_terrain_case
          cmake -S native_cpp -B "$RUNNER_TEMP/s3-p2" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p2" --parallel 2 \
            --target cteas_p2_glcc_raw cteas_p2_glcc_lu_dat
          cmake -S native_cpp/p3 -B "$RUNNER_TEMP/s3-p3" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p3" --parallel 2 --target cteas_p12_to_p3_dat cteas_p3_makegeo
          /usr/bin/python3 -m unittest -v native_cpp.orchestration.tests.test_case_admission
      - name: Create genuinely new Huoshan B0 case 100x100 100m UTM50N 2022
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          from pyproj import Transformer
          begin,end=os.environ["S3_RESEARCH_BEGIN"],os.environ["S3_RESEARCH_END"]
          assert (begin,end) in {("20220101-000000","20220103-000000"),
                                 ("20220601-000000","20220602-000000")}
          root=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022"
          assert not root.exists()
          (root/"grid").mkdir(parents=True)
          x0,y0,nx,ny,dgrid=462305,3501570,100,100,100
          lon,lat=Transformer.from_crs(32650,4326,always_xy=True).transform(
              x0+nx*dgrid/2,y0+ny*dgrid/2)
          assert abs(lon-116.655)<0.0001 and abs(lat-31.694)<0.0001
          (root/"case.yaml").write_text(
              "schema_version: 1\n"
              f"case_name: {root.name}\n"
              "settings:\n  timezone: UTC+0000\n  pstop_hpa_default: 500\n"
              "preprocess:\n  grid:\n    utm_zone: 50\n    hemisphere: N\n"
              "    nz: 9\n    resolution_km: 0.1\n"
              "    domain:\n      length_km: 10.0\n      width_km: 10.0\n"
              f"    center:\n      longitude: {lon:.12f}\n      latitude: {lat:.12f}\n"
              f"  research_time:\n    begin: {begin}\n    end: {end}\n"
              "  upperair:\n    station_id: auto\n    pstop_hpa: 500.0\n"
              "  surface:\n    auto_select_all: true\n"
              f"puff:\n  point_sources:\n    - latitude: {lat:.12f}\n      longitude: {lon:.12f}\n",
              encoding="utf-8")
          (root/"grid/grid.cmn").write_text(
              "! IMAP = UTM !\n! DATUM = WGS-84 !\n"
              "! IUTMZN = 50 !\n! LSOHEM = N !\n"
              "! XREFKM = 462.305 !\n! YREFKM = 3501.570 !\n"
              "! DGRIDKM = 0.100 !\n! NX = 100 !\n! NY = 100 !\n! NZ = 9 !\n"
              + "".join(f"! ZFACE = {value} !\n" for value in
                        (0,20,40,80,160,320,640,1200,2000,3000)),encoding="utf-8")
          (root/"grid/center_location").write_text(
              f"latitude: {lat:.12f}\nlongitude: {lon:.12f}\n", encoding="utf-8")
          (root/"grid/research_time").write_text(
              f"BEGIN:{begin}\nEND:{end}\n",encoding="utf-8")
          from native_cpp.orchestration.case_admission import admit_case
          b0=admit_case(root/"case.yaml")
          assert (b0.nx,b0.ny,b0.utm_zone,b0.hemisphere)==(100,100,50,"N")
          assert (b0.xrefkm_text,b0.yrefkm_text)==("462.305","3501.570")
          assert (b0.research_begin,b0.research_end)==(begin,end)
          print("S3_HUOSHAN_TRUE_NON_HEFEI_B0_ADMISSION=PASS")
          PY
      - name: Produce actual Huoshan P2-A native GLCC LU and immutable evidence
        run: |
          set -euo pipefail
          /usr/bin/python3 -m native_cpp.orchestration.p2a_case_producer \
            --case-yaml "$RUNNER_TEMP/s3_huoshan_2022/case.yaml" \
            --glcc-img "$PWD/eausgs2_0la.img" \
            --raw-bin "$RUNNER_TEMP/s3-p2/cteas_p2_glcc_raw" \
            --lu-bin "$RUNNER_TEMP/s3-p2/cteas_p2_glcc_lu_dat"
      - name: Cut bounded, exact-pixel Huoshan TIFF from authenticated 6000x6000 source with no interpolation
        run: |
          set -euo pipefail
          /usr/bin/python3 -m scripts.s2g.issue42_s3_b1_true_srtm_window \
            --case-yaml "$RUNNER_TEMP/s3_huoshan_2022/case.yaml" \
            --original-tif "$PWD/calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif" \
            --original-sha256 913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4 \
            --cropped-tif "$RUNNER_TEMP/s3_huoshan_2022/inputs/p1_srtm90_source_window.tif" \
            --manifest "$RUNNER_TEMP/s3_huoshan_2022/inputs/p1_srtm90_source_window.json"
          /usr/bin/python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022/inputs"
          j=json.loads((root/"p1_srtm90_source_window.json").read_text())
          assert j["status"]=="TRUE_SOURCE_WINDOW_PIXEL_IDENTITY_PASS_NOT_P1_SCIENCE"
          assert j["parent_original_tif_sha256"]=="913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4"
          assert j["window_pixel_count"]<5_000_000
          assert j["valid_source_pixels"]>0
          print("S3_NATIVE_P1_MEMORY_BUDGET_PRESERVED_REAL_SOURCE_PIXEL_WINDOW=PASS")
          PY
      - name: Produce actual Huoshan 90m terrain TERREL and P2-A based GEO without copying prior site
        run: |
          set -euo pipefail
          /usr/bin/python3 -m native_cpp.orchestration.p3_case_handoff \
            --case-yaml "$RUNNER_TEMP/s3_huoshan_2022/case.yaml" \
            --p1-tif "$RUNNER_TEMP/s3_huoshan_2022/inputs/p1_srtm90_source_window.tif" \
            --p1-tif-sha256 "$(/usr/bin/python3 -c 'import json,os;from pathlib import Path;p=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022/inputs/p1_srtm90_source_window.json";print(json.loads(p.read_text())["cropped_source_sha256"])')" \
            --p1-bin "$RUNNER_TEMP/s3-p1/cteas_p1_terrain_case" \
            --dat-bin "$RUNNER_TEMP/s3-p3/cteas_p12_to_p3_dat" \
            --p3-bin "$RUNNER_TEMP/s3-p3/cteas_p3_makegeo" \
            --p2-kind A
      - name: Fail closed unless real P1-P2A-P3 have identical B0 and nonempty 10k-cell products
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022"
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          p2=json.loads((root/"evidence/p2.json").read_text())
          p3=json.loads((root/"evidence/p3.json").read_text())
          b0=__import__("native_cpp.orchestration.case_admission",
                        fromlist=["admit_case"]).admit_case(root/"case.yaml")
          assert p2["status"]=="P2A_GENERIC_CASE_PRODUCED_UNVERIFIED"
          assert p3["status"]=="P3_NATIVE_SAME_CASE_PRODUCED_UNVERIFIED"
          assert p3["p2_kind"]=="A" and p3["p2_method"]==p2["method"]
          for value,field in ((b0.case_sha256,"case_yaml_sha256"),
                              (b0.grid_sha256,"grid_cmn_sha256"),
                              (b0.time_sha256,"research_time_sha256")):
              assert p2[field]==p3[field]==value
          assert p2["utm_epsg"]==p3["utm_epsg"]==32650
          assert (p2["nx"],p2["ny"])==(100,100)
          assert (p3["nx"],p3["ny"])==(100,100)
          assert p2["source_img_sha256"]=="4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a"
          source=json.loads((root/"inputs/p1_srtm90_source_window.json").read_text())
          assert source["parent_original_tif_sha256"]=="913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4"
          assert p3["p1_tif_sha256"]==source["cropped_source_sha256"]
          assert h(root/"inputs/p1_srtm90_source_window.tif")==source["cropped_source_sha256"]
          lu=root/"geo/ctgproc/p2a_case/lu/lu.dat"
          terrain=root/"geo/makegeo/p3_case/terrain.csv"
          terrel=root/"geo/makegeo/p3_case/terrel.dat"
          geo=root/"geo/makegeo/p3_case/geo.dat"
          for x in (lu,terrain,terrel,geo):
              assert x.is_file() and x.stat().st_size>500
          assert h(lu)==p2["lu_dat_sha256"]==p3["p2_lu_dat_sha256"]
          assert h(terrain)==p3["p1_csv_sha256"]
          assert h(terrel)==p3["terrel_dat_sha256"]
          assert h(geo)==p3["geo_dat_sha256"]
          assert h(root/"evidence/p2.json")==p3["p2_attestation_sha256"]
          import csv
          with terrain.open(newline="") as f:
              rows=list(csv.reader(f))
          assert len(rows)>=10000
          evidence={
            "status":"S3_HUOSHAN_REAL_P1_P2A_P3_PRODUCED_UNVERIFIED",
            "site":"HUOSHAN_NEW_SITE_NOT_FROZEN_HEFEI_OR_WOLSONG",
            "grid":{"utm_epsg":32650,"nx":100,"ny":100,"dgridkm":.1,
                    "xrefkm":"462.305","yrefkm":"3501.570"},
            "case_yaml_sha256":b0.case_sha256,
            "grid_cmn_sha256":b0.grid_sha256,
            "research_time_sha256":b0.time_sha256,
            "true_srtm90_parent_sha256":source["parent_original_tif_sha256"],
            "true_srtm90_window_sha256":source["cropped_source_sha256"],
            "source_window_manifest_sha256":h(root/"inputs/p1_srtm90_source_window.json"),
            "source_window_integer_pixel_count":source["window_pixel_count"],
            "true_historical_glcc_sha256":p2["source_img_sha256"],
            "p2_proof_sha256":h(root/"evidence/p2.json"),
            "p3_proof_sha256":h(root/"evidence/p3.json"),
            "native_terrain_sha256":h(terrain),"native_terrel_sha256":h(terrel),
            "native_lu_sha256":h(lu),"native_geo_sha256":h(geo),
            "p1_p2_p3_original_huoshan_numerical_parity":"NOT_RUN",
            "p4_genuine_igra_new_case":"NOT_RUN","p5_genuine_isd_new_case":"NOT_RUN",
            "g19_source_only":"NOT_RUN","s3_five_product_stack":"NOT_ACCEPTED",
            "docker":"DEFERRED"
          }
          out=root/"evidence/s3-huoshan-b1-real-terrel-glcc-geo.json"
          out.write_text(json.dumps(evidence,sort_keys=True,indent=2)+"\n")
          print("S3_HUOSHAN_REAL_DEM_GLCC_10K_NATIVE_GEO_SOURCE_SHA_LINK=PASS_PRODUCED_UNVERIFIED")
          PY
      - name: Independently compile unchanged SHA-pinned original Fortran MAKEGEO 3.2
        run: |
          set -euo pipefail
          vendor="$PWD/original_cteas/engine/vendor/src/MAKEGEO_V3.2_L110401"
          test "$(git -C original_cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          echo "8c4fb11db36d4b976b54f470b7a06ce4e38ab09e934951b0e2c613bddc34e347  $vendor/makegeo.for" | sha256sum -c -
          stage="$RUNNER_TEMP/s3-huoshan-original-stage"
          mkdir -p "$stage"
          for file in "$vendor"/*; do
            lower="$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            ln -s "$file" "$stage/$lower"
          done
          gfortran -std=legacy -ffixed-line-length-72 \
            -fno-automatic -fno-align-commons -fallow-argument-mismatch -O0 \
            -I"$stage" "$stage/makegeo.for" -o "$RUNNER_TEMP/s3-huoshan-original-makegeo"
          test -x "$RUNNER_TEMP/s3-huoshan-original-makegeo"
          sha256sum "$RUNNER_TEMP/s3-huoshan-original-makegeo"
      - name: Run original unmodified MAKEGEO on exact same Huoshan true-source TERREL and GLCC LU
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          case=root/"s3_huoshan_2022"
          work=root/"s3-huoshan-original-run"
          work.mkdir()
          for fn,p in (
              ("lu.dat",case/"geo/ctgproc/p2a_case/lu/lu.dat"),
              ("terrel.dat",case/"geo/makegeo/p3_case/terrel.dat"),
          ):
              assert p.is_file() and p.stat().st_size>1000
              (work/fn).symlink_to(p)
          control=(case/"geo/makegeo/p3_case/makegeo.inp").read_text()
          for key,value in (
              ("LUDAT","lu.dat"),("TERRDAT","terrel.dat"),
              ("GEODAT","original_geo.dat"),("RUNLST","original_makegeo.lst")
          ):
              control,count=re.subn(rf"(!\s*{key}\s*=\s*)([^!]*)(!)",
                                    lambda m:m.group(1)+value+" "+m.group(3),control)
              assert count==1,(key,count)
          (work/"makegeo.inp").write_text(control)
          (work/"MAKEGEO.INP").symlink_to("makegeo.inp")
          lu=(work/"lu.dat").read_text().splitlines()
          assert len(lu)==10011,("not exactly 10000 real Huoshan 38-class LU rows",len(lu))
          for index,line in enumerate(lu[11:]):
              vals=line.split()
              assert len(vals)==41,("original Fortran list-directed requires 2 indices+38 reals+marker",index,len(vals))
              assert (int(vals[0]),int(vals[1]))==(index%100+1,index//100+1)
              assert vals[40] in (".","Missing")
              assert all(0<=float(x)<=1 for x in vals[2:40])
          print("HUOSHAN_ORIGINAL_FORTRAN_10000_REAL_38CLASS_LU_SOURCE_ADMISSION=PASS")
          PY
          (
            cd "$RUNNER_TEMP/s3-huoshan-original-run"
            timeout 1800 "$RUNNER_TEMP/s3-huoshan-original-makegeo" > original_stdout.log 2>&1 || {
              tail -n 80 original_stdout.log
              test ! -f original_makegeo.lst || tail -n 80 original_makegeo.lst
              exit 1
            }
            test -s original_geo.dat || { tail -n 80 original_stdout.log; exit 1; }
            sha256sum original_geo.dat
          )
      - name: Independent original/C++ 10000-grid-times-eight selected physics numerical science
        run: |
          set -euo pipefail
          native="$RUNNER_TEMP/s3_huoshan_2022/geo/makegeo/p3_case"
          /usr/bin/python3 -m native_cpp.reference.compare_p3_makegeo_dynamic \
            --original-geo "$RUNNER_TEMP/s3-huoshan-original-run/original_geo.dat" \
            --cpp-csv "$native/p3.csv" --cpp-geo "$native/geo.dat" \
            --report "$RUNNER_TEMP/s3-huoshan-original-geo-80k.json" \
            --zone 50 --hem N --nx 100 --ny 100 \
            --xrefkm 462.305 --yrefkm 3501.570 --dgridkm 0.100
          /usr/bin/python3 - <<'PY'
          import json,os,hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          proof=json.loads((root/"s3-huoshan-original-geo-80k.json").read_text())
          case=root/"s3_huoshan_2022"
          p2=json.loads((case/"evidence/p2.json").read_text())
          p3=json.loads((case/"evidence/p3.json").read_text())
          src=json.loads((case/"inputs/p1_srtm90_source_window.json").read_text())
          digest=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert proof["status"]=="P3_NONHEFEI_ORIGINAL_MAKEGEO_PASS"
          assert proof["failures"]==0 and proof["values_compared"]==80000
          assert all(x["displayed_value_mismatches"]==0 and
                     x["csv_outside_fixed_precision_tolerance"]==0
                     for x in proof["metrics"].values())
          assert proof["native_geo_sha256"]==p3["geo_dat_sha256"]
          assert proof["native_csv_sha256"]==p3["p3_csv_sha256"]
          assert proof["original_geo_sha256"]==digest(root/"s3-huoshan-original-run/original_geo.dat")
          assert p3["p1_tif_sha256"]==src["cropped_source_sha256"]
          assert p3["p2_lu_dat_sha256"]==p2["lu_dat_sha256"]
          assert p3["case_yaml_sha256"]==p2["case_yaml_sha256"]
          assert p3["grid_cmn_sha256"]==p2["grid_cmn_sha256"]
          assert p3["research_time_sha256"]==p2["research_time_sha256"]
          certificate={
            "status":"S3_HUOSHAN_SELECTED_P3_ORIGINAL_MAKEGEO_80K_SCIENCE_PASS_SCOPED",
            "site":"HUOSHAN_REAL_SOURCE_NOT_HEFEI_OR_WOLSONG",
            "selected_original_source_ref":"RRain001/CTEAS@dfad99a78ed84d655e21411c9d25eb0d2583bf13",
            "selected_original_makegeo_sha256":"8c4fb11db36d4b976b54f470b7a06ce4e38ab09e934951b0e2c613bddc34e347",
            "source_srtm90_parent_sha256":src["parent_original_tif_sha256"],
            "source_srtm90_window_sha256":src["cropped_source_sha256"],
            "source_glcc_sha256":p2["source_img_sha256"],
            "case_yaml_sha256":p3["case_yaml_sha256"],
            "grid_cmn_sha256":p3["grid_cmn_sha256"],
            "research_time_sha256":p3["research_time_sha256"],
            "p2_lu_dat_sha256":p2["lu_dat_sha256"],
            "native_terrel_sha256":p3["terrel_dat_sha256"],
            "native_geo_sha256":p3["geo_dat_sha256"],
            "original_geo_sha256":proof["original_geo_sha256"],
            "original_comparison_report_sha256":digest(root/"s3-huoshan-original-geo-80k.json"),
            "native_geo_fields_compared":80000,"numerical_errors":0,
            "physical_scope":"SELECTED_ORIGINAL_NO_SNOW_38_TO_14_ONLY",
            "P4_UP":"NOT_RUN","P5_SURF":"NOT_RUN","G19_SOURCE":"NOT_RUN",
            "S3_REAL_P1_P5_STACK":"NOT_ACCEPTED","docker":"DEFERRED"
          }
          out=case/"evidence/s3-huoshan-original-p3-science.json"
          assert not out.exists()
          out.write_text(json.dumps(certificate,indent=2,sort_keys=True)+"\n")
          print("S3_HUOSHAN_TRUE_ORIGINAL_MAKEGEO_80000_DISPLAYED_VALUES_ZERO_DIFF=PASS_SCOPED")
