name: Issue42 S3-B1 authentic Huoshan terrain GLCC and GEO same-case source
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - .github/workflows/issue42-s3b1-huoshan-real-geo.yml
      - native_cpp/orchestration/p2a_case_producer.py
      - native_cpp/orchestration/p3_case_handoff.py
      - native_cpp/orchestration/case_admission.py
      - docs/plans/ISSUE42_S3_B1_HUOSHAN_REAL_SOURCE_20261020.md
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue42-s3b1-huoshan-real-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  genuine-huoshan-utm50-terrel-glcc-makegeo:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout true SRTM 90m and original GLCC via LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install approved original native build and independent grid dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            g++-12 cmake libgdal-dev libssl-dev python3-yaml python3-pyproj
      - name: Admit genuine SHA-verified already tracked SRTM90 and 156MB GLCC
        run: |
          set -euo pipefail
          srtm=calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif
          glcc=eausgs2_0la.img
          test "$(wc -c < "$srtm")" -eq 72096675
          test "$(wc -c < "$glcc")" -eq 156000000
          echo "913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4  $srtm" | sha256sum -c -
          echo "4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a  $glcc" | sha256sum -c -
          /usr/bin/python3 - <<'PY'
          from osgeo import gdal,osr
          d=gdal.Open("calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif")
          assert d is not None and (d.RasterXSize,d.RasterYSize,d.RasterCount)==(6000,6000,1)
          gt=d.GetGeoTransform()
          assert gt[0]==115 and gt[3]==35 and abs(gt[1]-1/1200)<1e-8 and abs(gt[5]+1/1200)<1e-8
          assert gt[2]==gt[4]==0
          reference=osr.SpatialReference()
          assert reference.ImportFromEPSG(4326)==0
          actual=osr.SpatialReference(wkt=d.GetProjection())
          assert bool(actual.IsSame(reference))
          print("S3_HUOSHAN_P1_REAL_SRTM90_GENUINE_SOURCE_SHA_AND_CRS=PASS")
          PY
      - name: Build only existing original-style C++ P1 P2A and P3 targets
        run: |
          set -euo pipefail
          cmake -S native_cpp/p1 -B "$RUNNER_TEMP/s3-p1" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p1" --parallel 2 --target cteas_p1_terrain_case
          cmake -S native_cpp -B "$RUNNER_TEMP/s3-p2" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p2" --parallel 2 \
            --target cteas_p2_glcc_raw cteas_p2_glcc_lu_dat
          cmake -S native_cpp/p3 -B "$RUNNER_TEMP/s3-p3" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s3-p3" --parallel 2 --target cteas_p12_to_p3_dat cteas_p3_makegeo
          /usr/bin/python3 -m unittest -v native_cpp.orchestration.tests.test_case_admission
      - name: Create genuinely new Huoshan B0 case 100x100 100m UTM50N 2022
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os
          from pathlib import Path
          from pyproj import Transformer
          root=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022"
          assert not root.exists()
          (root/"grid").mkdir(parents=True)
          x0,y0,nx,ny,dgrid=462305,3501570,100,100,100
          lon,lat=Transformer.from_crs(32650,4326,always_xy=True).transform(
              x0+nx*dgrid/2,y0+ny*dgrid/2)
          assert abs(lon-116.655)<0.0001 and abs(lat-31.694)<0.0001
          (root/"case.yaml").write_text(
              "schema_version: 1\n"
              f"case_name: {root.name}\n"
              "settings:\n  timezone: UTC+0000\n  pstop_hpa_default: 500\n"
              "preprocess:\n  grid:\n    utm_zone: 50\n    hemisphere: N\n"
              "    nz: 9\n    resolution_km: 0.1\n"
              "    domain:\n      length_km: 10.0\n      width_km: 10.0\n"
              f"    center:\n      longitude: {lon:.12f}\n      latitude: {lat:.12f}\n"
              "  research_time:\n    begin: 20220101-000000\n    end: 20220103-000000\n",
              encoding="utf-8")
          (root/"grid/grid.cmn").write_text(
              "! IMAP = UTM !\n! DATUM = WGS-84 !\n"
              "! IUTMZN = 50 !\n! LSOHEM = N !\n"
              "! XREFKM = 462.305 !\n! YREFKM = 3501.570 !\n"
              "! DGRIDKM = 0.100 !\n! NX = 100 !\n! NY = 100 !\n! NZ = 9 !\n"
              + "".join(f"! ZFACE = {value} !\n" for value in
                        (0,20,40,80,160,320,640,1200,2000,3000)),encoding="utf-8")
          (root/"grid/research_time").write_text(
              "BEGIN:20220101-000000\nEND:20220103-000000\n",encoding="utf-8")
          from native_cpp.orchestration.case_admission import admit_case
          b0=admit_case(root/"case.yaml")
          assert (b0.nx,b0.ny,b0.utm_zone,b0.hemisphere)==(100,100,50,"N")
          assert (b0.xrefkm_text,b0.yrefkm_text)==("462.305","3501.570")
          assert (b0.research_begin,b0.research_end)==("20220101-000000","20220103-000000")
          print("S3_HUOSHAN_TRUE_NON_HEFEI_B0_ADMISSION=PASS")
          PY
      - name: Produce actual Huoshan P2-A native GLCC LU and immutable evidence
        run: |
          set -euo pipefail
          /usr/bin/python3 -m native_cpp.orchestration.p2a_case_producer \
            --case-yaml "$RUNNER_TEMP/s3_huoshan_2022/case.yaml" \
            --glcc-img "$PWD/eausgs2_0la.img" \
            --raw-bin "$RUNNER_TEMP/s3-p2/cteas_p2_glcc_raw" \
            --lu-bin "$RUNNER_TEMP/s3-p2/cteas_p2_glcc_lu_dat"
      - name: Produce actual Huoshan 90m terrain TERREL and P2-A based GEO without copying prior site
        run: |
          set -euo pipefail
          /usr/bin/python3 -m native_cpp.orchestration.p3_case_handoff \
            --case-yaml "$RUNNER_TEMP/s3_huoshan_2022/case.yaml" \
            --p1-tif "$PWD/calpuff_terrain_and_landuse_data/china_srtm/srtm_60_06.tif" \
            --p1-tif-sha256 913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4 \
            --p1-bin "$RUNNER_TEMP/s3-p1/cteas_p1_terrain_case" \
            --dat-bin "$RUNNER_TEMP/s3-p3/cteas_p12_to_p3_dat" \
            --p3-bin "$RUNNER_TEMP/s3-p3/cteas_p3_makegeo" \
            --p2-kind A
      - name: Fail closed unless real P1-P2A-P3 have identical B0 and nonempty 10k-cell products
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path(os.environ["RUNNER_TEMP"])/"s3_huoshan_2022"
          h=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          p2=json.loads((root/"evidence/p2.json").read_text())
          p3=json.loads((root/"evidence/p3.json").read_text())
          b0=__import__("native_cpp.orchestration.case_admission",
                        fromlist=["admit_case"]).admit_case(root/"case.yaml")
          assert p2["status"]=="P2A_GENERIC_CASE_PRODUCED_UNVERIFIED"
          assert p3["status"]=="P3_NATIVE_SAME_CASE_PRODUCED_UNVERIFIED"
          assert p3["p2_kind"]=="A" and p3["p2_method"]==p2["method"]
          for value,field in ((b0.case_sha256,"case_yaml_sha256"),
                              (b0.grid_sha256,"grid_cmn_sha256"),
                              (b0.time_sha256,"research_time_sha256")):
              assert p2[field]==p3[field]==value
          assert p2["utm_epsg"]==p3["utm_epsg"]==32650
          assert (p2["nx"],p2["ny"])==(100,100)
          assert (p3["nx"],p3["ny"])==(100,100)
          assert p2["source_img_sha256"]=="4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a"
          assert p3["p1_tif_sha256"]=="913a082c79df74ff4189fec9d94b678618b395a6fb0a64ee94e14c532362eae4"
          lu=root/"geo/ctgproc/p2a_case/lu/lu.dat"
          terrain=root/"geo/makegeo/p3_case/terrain.csv"
          terrel=root/"geo/makegeo/p3_case/terrel.dat"
          geo=root/"geo/makegeo/p3_case/geo.dat"
          for x in (lu,terrain,terrel,geo):
              assert x.is_file() and x.stat().st_size>500
          assert h(lu)==p2["lu_dat_sha256"]==p3["p2_lu_dat_sha256"]
          assert h(terrain)==p3["p1_csv_sha256"]
          assert h(terrel)==p3["terrel_dat_sha256"]
          assert h(geo)==p3["geo_dat_sha256"]
          assert h(root/"evidence/p2.json")==p3["p2_attestation_sha256"]
          import csv
          with terrain.open(newline="") as f:
              rows=list(csv.reader(f))
          assert len(rows)>=10000
          evidence={
            "status":"S3_HUOSHAN_REAL_P1_P2A_P3_PRODUCED_UNVERIFIED",
            "site":"HUOSHAN_NEW_SITE_NOT_FROZEN_HEFEI_OR_WOLSONG",
            "grid":{"utm_epsg":32650,"nx":100,"ny":100,"dgridkm":.1,
                    "xrefkm":"462.305","yrefkm":"3501.570"},
            "case_yaml_sha256":b0.case_sha256,
            "grid_cmn_sha256":b0.grid_sha256,
            "research_time_sha256":b0.time_sha256,
            "true_srtm90_sha256":p3["p1_tif_sha256"],
            "true_historical_glcc_sha256":p2["source_img_sha256"],
            "p2_proof_sha256":h(root/"evidence/p2.json"),
            "p3_proof_sha256":h(root/"evidence/p3.json"),
            "native_terrain_sha256":h(terrain),"native_terrel_sha256":h(terrel),
            "native_lu_sha256":h(lu),"native_geo_sha256":h(geo),
            "p1_p2_p3_original_huoshan_numerical_parity":"NOT_RUN",
            "p4_genuine_igra_new_case":"NOT_RUN","p5_genuine_isd_new_case":"NOT_RUN",
            "g19_source_only":"NOT_RUN","s3_five_product_stack":"NOT_ACCEPTED",
            "docker":"DEFERRED"
          }
          out=root/"evidence/s3-huoshan-b1-real-terrel-glcc-geo.json"
          out.write_text(json.dumps(evidence,sort_keys=True,indent=2)+"\n")
          print("S3_HUOSHAN_REAL_DEM_GLCC_10K_NATIVE_GEO_SOURCE_SHA_LINK=PASS_PRODUCED_UNVERIFIED")
          PY
      - name: Upload only bounded SHA lineage and real product metadata not source bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue42-s3-b1-real-huoshan-terrel-glcc-geo-evidence
          path: |
            ${{ runner.temp }}/s3_huoshan_2022/evidence/p2.json
            ${{ runner.temp }}/s3_huoshan_2022/evidence/p3.json
            ${{ runner.temp }}/s3_huoshan_2022/evidence/s3-huoshan-b1-real-terrel-glcc-geo.json
            ${{ runner.temp }}/s3_huoshan_2022/geo/ctgproc/p2a_case/raw/p2_manifest.json
            ${{ runner.temp }}/s3_huoshan_2022/geo/ctgproc/p2a_case/lu/p2_d3_manifest.json
          retention-days: 21
          if-no-files-found: warn
