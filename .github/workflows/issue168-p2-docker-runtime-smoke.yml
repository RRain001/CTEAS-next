name: Issue168 S1 P2-A/C container runtime smoke on AMD64 and ARM64
# Scoped packaging gate only: do not launch science or 143-hour physical runs.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - docker/cpp/Dockerfile
      - scripts/migration/validate_ubuntu.py
      - native_cpp/CMakeLists.txt
      - .github/workflows/issue168-p2-docker-runtime-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue168-p2-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-scoped-runtime:
    name: ${{ matrix.arch }} P2-A/C scoped runtime binary admission
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Diagnose existing standalone P7 configure before full Docker build
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p7_calpuff \
            -B "$RUNNER_TEMP/s1-p7-configure-diagnostic" \
            -DCMAKE_BUILD_TYPE=Debug
      - name: Build production/runtime stage using existing portable builder
        run: |
          set -euo pipefail
          docker build --progress=plain --file docker/cpp/Dockerfile \
            --target runtime --tag "cteas-next:s1-${{ matrix.arch }}" .
      - name: Confirm P2-A and P2-C binaries and absence of retired B area entry
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/sh "cteas-next:s1-${{ matrix.arch }}" -ec '
            test -x /opt/cteas/bin/cteas_p2_glcc_raw
            test -x /opt/cteas/bin/cteas_p2c_glc30m_sampling
            test ! -e /opt/cteas/bin/cteas_p2_glc_raw
            test ! -e /opt/cteas/bin/cteas_p2_glc_lu_dat
            test ! -e /opt/cteas/bin/cteas_p2_glc_area
            echo "S1_P2_A_C_RUNTIME_B_ONLY_ABSENT=PASS"
          '
      - name: Record image architecture and no original vendor source inclusion
        run: |
          set -euo pipefail
          docker image inspect "cteas-next:s1-${{ matrix.arch }}" \
            --format 'Architecture={{.Architecture}}'
          docker run --rm --entrypoint /bin/sh "cteas-next:s1-${{ matrix.arch }}" -ec '
            test ! -d /src/original_cteas
            test ! -e /opt/cteas/bin/ctgproc
            echo "S1_NO_VENDOR_SOURCE_OR_ORIGINAL_BINARY_REPACKAGING=PASS"
          '
