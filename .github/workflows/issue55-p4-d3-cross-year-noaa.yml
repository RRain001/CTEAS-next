name: Issue 55 P4 D2-D3 authentic NOAA cross-year original READ62 parity
# Automatic bounded 2022-12-31 to 2023-01-01 real-source year-boundary test only.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue55-crossyear-d3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-noaa-crossyear-original-fortran-native-cpp:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact new-case producer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout pinned independent original READ62
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original-cteas
          persist-credentials: false
      - name: Install original compiler and upper-air parsing prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'numpy>=1.23,<3' 'pandas>=1.5,<3' 'PyYAML>=6,<7'
          sudo apt-get update -qq
          sudo apt-get install -y -qq gfortran
          python3 -m compileall -q scripts/s2g/issue55_p4_d3_short.py
      - name: Build native P4 and P6 source-only original-format parser
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p4_read62 -B "$RUNNER_TEMP/p4-native" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/p4-native" --parallel 2 --target cteas_p4_read62 cteas_p4_tests
          ctest --test-dir "$RUNNER_TEMP/p4-native" --output-on-failure
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/p4-g19" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/p4-g19" --parallel 2 --target cteas_p6g_up_source_preflight
      - name: Build original unchanged Fortran source with temporary aliases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p4-original/src" "$RUNNER_TEMP/p4-d3-evidence"
          cp -a original-cteas/engine/vendor/src/READ62_v5.661_L110225/. "$RUNNER_TEMP/p4-original/src/"
          for file in "$RUNNER_TEMP/p4-original/src"/*; do
            base="$(basename "$file")"
            lower="$(printf '%s' "$base" | tr '[:upper:]' '[:lower:]')"
            if [ "$base" != "$lower" ] && [ ! -e "$RUNNER_TEMP/p4-original/src/$lower" ]; then
              ln -s "$base" "$RUNNER_TEMP/p4-original/src/$lower"
            fi
          done
          gfortran -O0 -std=legacy -ffixed-line-length-72 -fallow-argument-mismatch -fno-automatic \
            -I"$RUNNER_TEMP/p4-original/src" \
            -o "$RUNNER_TEMP/p4-original/read62" "$RUNNER_TEMP/p4-original/src/READ62.FOR"
          sha256sum "$RUNNER_TEMP/p4-original/src/READ62.FOR" > "$RUNNER_TEMP/p4-d3-evidence/fortran-source.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/p4-d3-evidence/head.sha"
      - name: Authentic 2022/2023 New Year split source and independent original/native UP parity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.issue55_p4_d3_cross_year \
            --native-bin "$RUNNER_TEMP/p4-native/cteas_p4_read62" \
            --original-bin "$RUNNER_TEMP/p4-original/read62" \
            --original-inp "$RUNNER_TEMP/p4-original/src/read62.inp" \
            --g19-source-preflight "$RUNNER_TEMP/p4-g19/cteas_p6g_up_source_preflight" \
            --evidence-out "$RUNNER_TEMP/p4-d3-evidence/p4-2022-2023-actual-newyear.json"
          python3 - "$RUNNER_TEMP/p4-d3-evidence" <<'PY'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          e=json.loads((p/"p4-2022-2023-actual-newyear.json").read_text())
          assert e["status"]=="PASS_SCOPED_REAL_NOAA_2022_2023_AUTHENTIC_CROSS_YEAR"
          assert [v["year"] for v in e["annual_independent_original_parity"]]==[2022,2023]
          assert [v["genuine_original_profiles"] for v in e["annual_independent_original_parity"]]==[1,2]
          assert all(v["original_native_bytes_identical"] for v in e["annual_independent_original_parity"])
          assert e["final_soundings"]==3 and e["g19_hour_end_checked"]==8
          assert e["g19_complete"]=="NOT_RUN" and e["p6_p7_physics"]=="NOT_RUN"
          print("P4_55_REAL_ORIGINAL_NOAA_YEAR_BOUNDARY_D2_D3=PASS_SCOPED")
          print("P4_55_PARENT_JOINT_G19=NOT_RUN")
          PY
      - name: Publish evidence metadata and SHA only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue55-d3-authentic-2022-2023-crossyear-original-native
          path: ${{ runner.temp }}/p4-d3-evidence/
          retention-days: 7
          if-no-files-found: warn
