name: Issue123 D4 Fortran-style PNPOLY and COASTRD BLN (synthetic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d4-pnpoly-software-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install C++ prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++-12 libgdal-dev libssl-dev
      - name: Build isolated D4 point/BLN tests
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/issue123-d4" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/issue123-d4" --parallel 2 --target cteas_p2_original_bln_pnpoly_tests cteas_p2_original_coast_policy_tests
      - name: Test scoped D4 REAL4 PNPOLY and D1 coastal mapping (never run real science)
        run: |
          set -euo pipefail
          ctest --test-dir "${RUNNER_TEMP}/issue123-d4" -R '^cteas_p2_original_(bln_pnpoly|coast_policy)_synthetic$' --output-on-failure
          echo "ISSUE123_D4_PNPOLY_R4=PASS_SYNTHETIC_ONLY REAL_ORIGINAL_FORTRAN_COMPARISON=NOT_RUN EXACT_AREA_V1=FROZEN_UNCHANGED"
