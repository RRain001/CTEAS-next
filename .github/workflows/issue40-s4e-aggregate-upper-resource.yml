name: "Issue40 S4-E aggregate original UP sounding resource"
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/read_upper_dynamic.hpp'
      - 'native_cpp/modules/p6_calmet/tests/p6g_g19_file_backed_case_tests.cpp'
      - '.github/workflows/issue40-s4e-aggregate-upper-resource.yml'
      - 'docs/plans/ISSUE40_S4E_AGGREGATE_UP_RESOURCE_20261021.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-source-upper-input:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile genuine G19 original-source multistation input regression
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/s4e-g19" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4e-g19" --parallel 2 --target cteas_p6g_g19_file_backed_case_tests
      - name: G19 original-formatted 20SS/20US identity and aggregate UP sounding budget
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/s4e-g19/cteas_p6g_g19_file_backed_case_tests" \
            "$GITHUB_WORKSPACE/project/cases/hefei5km_2022_reference_case_20261011/run/met/met.inp" \
            | tee "$RUNNER_TEMP/s4e-original-input-evidence.txt"
          grep -F "PASS_P6G_G19_FILE_BACKED_CARDINALITY_20SS_20US_ORIGINAL_FORMAT_INPUT" \
            "$RUNNER_TEMP/s4e-original-input-evidence.txt"
          grep -F "PASS_P6G_G19_FILE_BACKED_CARDINALITY_20SS_1US_ORIGINAL_FORMAT_INPUT" \
            "$RUNNER_TEMP/s4e-original-input-evidence.txt"
          grep -F "PASS_P6G_G19_FILE_BACKED_CARDINALITY_1SS_20US_ORIGINAL_FORMAT_INPUT" \
            "$RUNNER_TEMP/s4e-original-input-evidence.txt"
          grep -F "PRODUCTION_PHYSICS_NOT_ACCEPTED" "$RUNNER_TEMP/s4e-original-input-evidence.txt"
          echo "S4E_20SS_20US_AGGREGATE_UP_SOUNDING_DENIAL=PASS_SOFTWARE_SOURCE_ONLY"
          echo "S4E_G26_PRODUCTION=NOT_ACCEPTED"
      - name: Preserve actual source-admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4e-20site-original-source-aggregate-upper
          path: ${{ runner.temp }}/s4e-original-input-evidence.txt
          if-no-files-found: warn
          retention-days: 14
