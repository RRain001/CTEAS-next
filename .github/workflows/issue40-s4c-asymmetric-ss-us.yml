name: "Issue40 S4C asymmetric source-backed selected G14 physics"
on:
  pull_request:
    paths:
      - 'native_cpp/modules/p6_calmet/tests/p6g_g19_file_backed_case_tests.cpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g20_file_backed_wind1_profiles.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g18a_selected_comp_mixht.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g18c3_temp3d_after_comp.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g18c5_selected_p6f_fields.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g18c6_selected_p6f_dataset.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_g26b_file_backed_comp_bridge.hpp'
      - 'native_cpp/modules/p6_calmet/include/cteas/p6/p6g_s4b2_selected_hour.hpp'
      - '.github/workflows/issue40-s4c-asymmetric-ss-us.yml'
      - 'docs/plans/ISSUE40_S4C_ASYMMETRIC_STATION_SOURCE_20261020.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-source-asymmetric-hour:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        station_counts:
          - {ss: 1, us: 2}
          - {ss: 2, us: 1}
          - {ss: 2, us: 2}
          - {ss: 1, us: 1}
    steps:
      - name: Checkout exact test source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile G19 original source/selection and SAME unified G14 candidate
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/s4c" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4c" --parallel 2 --target \
            cteas_p6g_g19_file_backed_case_tests \
            cteas_p6g_s4b2_unified_selected \
            cteas_p6g_g34b_six_hour_selected_gate
      - name: Source-only independently cardinal source with NO extra copied stations
        shell: bash
        env:
          NS: ${{ matrix.station_counts.ss }}
          NU: ${{ matrix.station_counts.us }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/case"
          "$RUNNER_TEMP/s4c/cteas_p6g_g19_file_backed_case_tests" \
            --export-case project/cases/hefei5km_2022_reference_case_20261011/run/met/met.inp \
            "$RUNNER_TEMP/case" --fradj-stress --daylight-first-hour --hours 6 \
            --stations "$NS" "$NU"
          test -s "$RUNNER_TEMP/case/met.inp"
          test -s "$RUNNER_TEMP/case/GEO.DAT"
          test -s "$RUNNER_TEMP/case/SURF.DAT"
          test -s "$RUNNER_TEMP/case/UP1.DAT"
          if [[ "$NU" -eq 1 ]]; then
            test ! -e "$RUNNER_TEMP/case/UP2.DAT"
          else
            test -s "$RUNNER_TEMP/case/UP2.DAT"
          fi
          sha256sum "$RUNNER_TEMP/case/met.inp" "$RUNNER_TEMP/case/GEO.DAT" \
            "$RUNNER_TEMP/case/SURF.DAT" "$RUNNER_TEMP/case/"UP*.DAT \
            > "$RUNNER_TEMP/s4c-source-hash.txt"
          echo "S4C_CONTROLLED_ORIGINAL_FORMAT_SUBSET_SOURCE_ADMITTED=PASS SS=$NS US=$NU"
      - name: Same shared G14 selected physical actor first-hour and six-hour probes
        shell: bash
        env:
          NS: ${{ matrix.station_counts.ss }}
          NU: ${{ matrix.station_counts.us }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/case"
          b="$RUNNER_TEMP/s4c/cteas_p6g_s4b2_unified_selected"
          args=(--selected-experimental --met "$src/met.inp" --geo "$src/GEO.DAT" \
            --surf "$src/SURF.DAT" --up "$src/UP1.DAT")
          if [[ "$NU" -eq 2 ]]; then args+=(--up "$src/UP2.DAT"); fi
          "$b" "${args[@]}" --hours 6 --probe-prefix-hours 1 \
            --out "$RUNNER_TEMP/s4c-first-hour-candidate.dat" \
            | tee "$RUNNER_TEMP/s4c-first-hour-trace.txt"
          "$b" "${args[@]}" --hours 6 \
            --out "$RUNNER_TEMP/s4c-six-hour-candidate.dat" \
            | tee "$RUNNER_TEMP/s4c-six-hour-trace.txt"
          test -s "$RUNNER_TEMP/s4c-first-hour-candidate.dat"
          test -s "$RUNNER_TEMP/s4c-six-hour-candidate.dat"
          sha256sum "$RUNNER_TEMP/s4c-first-hour-candidate.dat" \
                    "$RUNNER_TEMP/s4c-six-hour-candidate.dat" \
            | tee "$RUNNER_TEMP/s4c-output-hash.txt"
          echo "S4C_ASYMMETRIC_SHARED_G14_NATIVE_1H_6H=PRODUCED_UNVERIFIED SS=$NS US=$NU"
          echo "S4C_ASYMMETRIC_ORIGINAL_FORTRAN_45_FIELD=NOT_RUN"
      - name: Frozen C2 old-versus-shared-actor byte parity for 2SS 2US
        if: matrix.station_counts.ss == 2 && matrix.station_counts.us == 2
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/case"
          "$RUNNER_TEMP/s4c/cteas_p6g_g34b_six_hour_selected_gate" \
            "$src/met.inp" "$src/GEO.DAT" "$src/SURF.DAT" \
            "$src/UP1.DAT" "$src/UP2.DAT" \
            "$RUNNER_TEMP/s4c-old-c2.dat"
          cmp "$RUNNER_TEMP/s4c-old-c2.dat" "$RUNNER_TEMP/s4c-six-hour-candidate.dat"
          echo "S4C_C2_6H_OLD_VS_SHARED_G14=BYTE_IDENTICAL"
      - name: Preserve scientific scope and source file SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s4c-controlled-asymmetric-${{ matrix.station_counts.ss }}ss-${{ matrix.station_counts.us }}us
          path: |
            ${{ runner.temp }}/s4c-source-hash.txt
            ${{ runner.temp }}/s4c-first-hour-trace.txt
            ${{ runner.temp }}/s4c-six-hour-trace.txt
            ${{ runner.temp }}/s4c-output-hash.txt
          if-no-files-found: warn
          retention-days: 14
