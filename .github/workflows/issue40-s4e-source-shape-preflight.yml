name: "Issue40 S4-E source-owned station resource preflight"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-bounds-station-shape:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile checked source-only admission
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp/modules/p6_calmet -B "$RUNNER_TEMP/s4e" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s4e" --parallel 2 --target \
            cteas_p6g_s4b1_admission_tests \
            cteas_p6g_s4b1_source_admission
      - name: Execute positive 20+20, asymmetric, >original-source capacity and overflow rejection
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/s4e/cteas_p6g_s4b1_admission_tests"
          ctest --test-dir "$RUNNER_TEMP/s4e" --output-on-failure \
            -R '^p6g_s4b1_(independent_station_cardinality_source_admission|refuses_unaccepted_production_execute)$'
          echo "S4E_SOURCE_ONLY_DYNAMIC_SHAPE_OVERFLOW=PASS_SOFTWARE_ONLY"
          echo "S4E_G26_PRODUCTION_AND_REAL_MULTISITE_SCIENCE=NOT_ACCEPTED"
