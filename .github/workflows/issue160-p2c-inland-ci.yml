name: Issue160 P2-C C0-C1 inland GLCC compile and synthetic regression
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - native_cpp/src/p2_original_sampling_hefei_cli.cpp
      - native_cpp/include/cteas/geo/ctgproc_original_sampling_lu_writer.hpp
      - native_cpp/tests/p2_original_sampling_lu_writer_tests.cpp
      - native_cpp/CMakeLists.txt
      - docs/plans/ISSUE160_P2C_C0_BASELINE_DEPENDENCIES_20261020.md
      - .github/workflows/issue160-p2c-inland-ci.yml
  push:
    branches: [main]
    paths:
      - native_cpp/src/p2_original_sampling_hefei_cli.cpp
      - native_cpp/include/cteas/geo/ctgproc_original_sampling_lu_writer.hpp
      - native_cpp/tests/p2_original_sampling_lu_writer_tests.cpp
      - native_cpp/CMakeLists.txt
      - .github/workflows/issue160-p2c-inland-ci.yml
permissions:
  contents: read
jobs:
  compile-and-synthetic-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install native geospatial and compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libgdal-dev libssl-dev
      - name: Configure native P2
        run: cmake -S native_cpp -B "${RUNNER_TEMP}/p2c160-build" -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build retained original GLCC sampling targets
        run: |
          cmake --build "${RUNNER_TEMP}/p2c160-build" --parallel 3 --target \
            cteas_p2_original_sampling_hefei \
            cteas_p2_original_sampling_wolsong \
            cteas_p2_original_sampling_lu_tests \
            cteas_p2_original_sampling_recount_tests \
            cteas_p2_original_coast_policy_tests \
            cteas_p2_original_bln_pnpoly_tests
      - name: Synthetic original-writer and coast regression
        run: |
          ctest --test-dir "${RUNNER_TEMP}/p2c160-build" --output-on-failure \
            -R 'cteas_p2_original_(sampling_lu_writer|sampling_recount_synthetic|coast_policy_synthetic|bln_pnpoly_synthetic)'
      - name: New inland CLI must reject missing real canonical GLCC data
        run: |
          set -euo pipefail
          if "${RUNNER_TEMP}/p2c160-build/cteas_p2_original_sampling_hefei" /nonexistent /tmp/issue160-should-never-exist; then
            echo "ERROR: canonical source admission did not fail closed"
            exit 1
          fi
          test ! -e /tmp/issue160-should-never-exist
          echo "P2C_ISSUE160_C1_COMPILE_SYNTHETIC_ONLY=PASS_IF_ALL_STEPS_SUCCEED"
          echo "HEFEI_REAL_FORTRAN_GLCC_ORACLE=NOT_RUN"
          echo "GLC30M_ORIGINAL_POINT_SAMPLING=NOT_RUN"
          echo "P3_FORMAT_INDEPENDENT=NOT_RUN"
