name: Issue123 D5 original GSHHS Full binary admission (offline synthetic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-binary-source-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Exercise synthetic ZIP selection and v2.x header checks only
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest -v scripts.s2g.tests.test_issue123_gshhg_binary_full
          echo "ISSUE123_D5_BINARY_CONTRACT=PASS_SYNTHETIC_ONLY AUTHENTIC_FULL_BIN=NOT_RUN COASTEXT_BLN=NOT_RUN"
