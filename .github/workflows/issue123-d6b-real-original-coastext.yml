name: Issue123 D6B original CTGPROC Wolsong coast.bln
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - scripts/s2g/issue123_original_coastext_wolsong.py
      - scripts/s2g/issue123_gfortran_stream_io_adapter.py
      - scripts/s2g/issue123_gfortran_split_io_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_split_io_adapter.py
      - scripts/s2g/issue123_gfortran_eof_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_eof_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_stream_io_adapter.py
      - scripts/s2g/tests/test_issue123_original_coastext_wolsong.py
      - scripts/s2g/issue123_d8_real_bln_iptype.py
      - scripts/s2g/tests/test_issue123_d8_real_bln_iptype.py
      - native_cpp/src/p2_original_iptype_bln_batch_cli.cpp
      - scripts/s2g/issue123_d9_original_coastal_hits.py
      - scripts/s2g/tests/test_issue123_d9_original_coastal_hits.py
      - native_cpp/src/p2_original_coast_hits_wolsong_cli.cpp
      - scripts/s2g/issue123_science_run_callback.py
      - scripts/s2g/tests/test_issue123_science_run_callback.py
      - .github/workflows/issue123-d6b-real-original-coastext.yml
  push:
    branches: [main]
    paths:
      - scripts/s2g/issue123_original_coastext_wolsong.py
      - scripts/s2g/issue123_gfortran_stream_io_adapter.py
      - scripts/s2g/issue123_gfortran_split_io_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_split_io_adapter.py
      - scripts/s2g/issue123_gfortran_eof_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_eof_adapter.py
      - scripts/s2g/tests/test_issue123_gfortran_stream_io_adapter.py
      - scripts/s2g/tests/test_issue123_original_coastext_wolsong.py
      - scripts/s2g/issue123_d8_real_bln_iptype.py
      - scripts/s2g/tests/test_issue123_d8_real_bln_iptype.py
      - native_cpp/src/p2_original_iptype_bln_batch_cli.cpp
      - scripts/s2g/issue123_d9_original_coastal_hits.py
      - scripts/s2g/tests/test_issue123_d9_original_coastal_hits.py
      - native_cpp/src/p2_original_coast_hits_wolsong_cli.cpp
      - scripts/s2g/issue123_science_run_callback.py
      - scripts/s2g/tests/test_issue123_science_run_callback.py
      - .github/workflows/issue123-d6b-real-original-coastext.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue123-d6b-original-coastext-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'authentic-main' }}
  cancel-in-progress: false
jobs:
  offline-original-deck-and-bln-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Synthetic legal control and original BLN tests only
        run: |
          set -euo pipefail
          python3 -m unittest -v scripts.s2g.tests.test_issue123_original_coastext_wolsong scripts.s2g.tests.test_issue123_gfortran_stream_io_adapter scripts.s2g.tests.test_issue123_gfortran_eof_adapter scripts.s2g.tests.test_issue123_gfortran_split_io_adapter scripts.s2g.tests.test_issue123_d8_real_bln_iptype scripts.s2g.tests.test_issue123_d9_original_coastal_hits scripts.s2g.tests.test_issue123_science_run_callback
          echo "D6B_SOFTWARE=PASS ORIGINAL_COASTEXT=NOT_RUN"
      - name: D8 source/runtime preflight checkout (compile only, no real scientific claims)
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: engine/vendor/src/CTGPROC_v7.0.0_L150211
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: D8 compile original Fortran and native classifier without genuine source data
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran g++-12 cmake libgdal-dev libssl-dev
          vendor="$GITHUB_WORKSPACE/original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211"
          test "$(git -C original_cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          mkdir -p "$RUNNER_TEMP/d8-offline-include" "$RUNNER_TEMP/d8-offline-extracted"
          for file in "$vendor"/*; do
            bn="$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            ln -s "$file" "$RUNNER_TEMP/d8-offline-include/$bn"
          done
          python3 - "$vendor/ctgproc.for" "$RUNNER_TEMP/d8-offline-extracted" <<'PY'
          from pathlib import Path
          import sys
          from scripts.s2g.issue123_d8_real_bln_iptype import extract_original, FORTRAN_DRIVER
          out=Path(sys.argv[2])
          extract_original(Path(sys.argv[1]),out)
          (out/'d8_driver.for').write_text(FORTRAN_DRIVER)
          PY
          work="$RUNNER_TEMP/d8-offline-extracted"
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic \
            -fno-align-commons -fallow-argument-mismatch -ffp-contract=off \
            -O0 -I"$RUNNER_TEMP/d8-offline-include" \
            "$work/original_d8_routines.for" "$work/d8_driver.for" \
            -o "$work/original_iptype"
          cmake -S native_cpp -B "$RUNNER_TEMP/d8-offline-native" \
            -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/d8-offline-native" --parallel 2 \
            --target cteas_p2_original_iptype_bln_batch cteas_p2_original_bln_pnpoly_tests cteas_p2_original_coast_hits_wolsong
          ctest --test-dir "$RUNNER_TEMP/d8-offline-native" \
            -R cteas_p2_original_bln_pnpoly_synthetic --output-on-failure
          echo "D8_REAL_BLN_SCIENCE=NOT_RUN COMPILE_PREFLIGHT=PASS"
  genuine-original-wolsong-coastext-io-adapted:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [offline-original-deck-and-bln-contract]
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout CTEAS-next with real GLCC LFS data
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Separately checkout exact original Fortran commit
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original_cteas
          sparse-checkout: engine/vendor/src/CTGPROC_v7.0.0_L150211
          sparse-checkout-cone-mode: true
          lfs: false
          persist-credentials: false
      - name: Install GNU Fortran
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gfortran g++-12 cmake libgdal-dev libssl-dev
      - name: SHA-pin original source and build original algorithms with audited GNU IO adapters
        run: |
          set -euo pipefail
          test "$(git -C original_cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          vendor="$PWD/original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211"
          echo "719abbd2327269bb0377208b3a7a0c74000b878efc756686023bbb2ef932f281  $vendor/ctgproc.for" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/issue123-d6b-includes"
          for file in "$vendor"/*; do
            bn="$(basename "$file" | tr '[:upper:]' '[:lower:]')"
            ln -s "$file" "$RUNNER_TEMP/issue123-d6b-includes/$bn"
          done
          stage="$RUNNER_TEMP/issue123-d6b-includes"
          rm "$stage/ctgproc.for" "$stage/params.ctg"
          cp "$vendor/ctgproc.for" "$stage/ctgproc.for"
          cmp "$vendor/ctgproc.for" "$stage/ctgproc.for"
          # GLCC requires DIRECT/RECL=1 because COMP uses READ(IOINP,REC=).
          cp "$vendor/params.ctg" "$stage/params.ctg"
          cmp "$vendor/params.ctg" "$stage/params.ctg"
          echo "28dc5877c6a70d74f7a0e136bdd4aa1777dc9cbab15c184e7f483f772cd266c6  $stage/params.ctg" | sha256sum -c -
          python3 -m scripts.s2g.issue123_gfortran_eof_adapter \
            --original-source "$vendor/ctgproc.for" --staged-source "$stage/ctgproc.for" \
            --manifest "$RUNNER_TEMP/issue123-d6b-eof-adapter.json"
          # Only the GSHHG COASTEXT OPEN is STREAM; GLCC keeps DIRECT.
          python3 -m scripts.s2g.issue123_gfortran_split_io_adapter \
            --original-source "$vendor/ctgproc.for" --original-params "$vendor/params.ctg" \
            --staged-source "$stage/ctgproc.for" --staged-params "$stage/params.ctg" \
            --manifest "$RUNNER_TEMP/issue123-d6b-split-io-adapter.json"
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic -fno-align-commons -fallow-argument-mismatch -O0 -I"$stage" "$stage/ctgproc.for" -o "$RUNNER_TEMP/issue123-original-ctgproc"
      - name: Verify real GSHHG Full and GLCC source SHA
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.issue123_gshhg_binary_full fetch --cache "$RUNNER_TEMP/issue123-d6b-gshhs"
          test "$(wc -c < eausgs2_0la.img)" -eq 156000000
          echo "4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a  eausgs2_0la.img" | sha256sum -c -
      - name: Generate original legal GLAZAS and Wolsong coast control
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.issue123_original_coastext_wolsong prepare \
            --original-source original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211/ctgproc.for \
            --template original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211/ctgproc.inp \
            --glcc eausgs2_0la.img \
            --cache "$RUNNER_TEMP/issue123-d6b-gshhs" \
            --out "$RUNNER_TEMP/issue123-d6b-original-run"
          cp "$RUNNER_TEMP/issue123-d6b-split-io-adapter.json" "$RUNNER_TEMP/issue123-d6b-original-run/split_io_adapter_manifest.json"
          cp "$RUNNER_TEMP/issue123-d6b-eof-adapter.json" "$RUNNER_TEMP/issue123-d6b-original-run/eof_adapter_manifest.json"
      - name: Execute genuine original Fortran COASTEXT
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/issue123-d6b-original-run"
          timeout 1800 "$RUNNER_TEMP/issue123-original-ctgproc" > original_run.log 2>&1 || {
            echo "D6B_ORIGINAL_CTGPROC_RUN_FAILED"
            tail -n 35 original_run.log
            exit 1
          }
          if test ! -s coast.bln; then
            echo "D6B_ORIGINAL_CTGPROC_MISSING_COAST_BLN: fail-closed"
            echo "----- sanitized original stdout tail -----"
            tail -n 70 original_run.log || true
            if test -f ctgproc.lst; then
              echo "----- original CTGPROC.LST tail -----"
              tail -n 70 ctgproc.lst || true
            fi
            echo "----- output basename inventory -----"
            find . -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
            exit 2
          fi
      - name: Audit actual original BLN source provenance and contents
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.issue123_original_coastext_wolsong audit \
            --out "$RUNNER_TEMP/issue123-d6b-original-run" \
            --original-binary "$RUNNER_TEMP/issue123-original-ctgproc"
          echo "D6B_ORIGINAL_COASTEXT=PASS_IF_AUDIT ORIGINAL_IPTYPE_PARITY=NOT_RUN ORIGINAL_HITS_LU_PARITY=NOT_RUN"
      - name: D8 construct same authentic BLN and REAL4 point oracle input
        run: |
          set -euo pipefail
          python3 -m scripts.s2g.issue123_d8_real_bln_iptype prepare \
            --out "$RUNNER_TEMP/issue123-d8-oracle" \
            --original-source original_cteas/engine/vendor/src/CTGPROC_v7.0.0_L150211/ctgproc.for \
            --bln "$RUNNER_TEMP/issue123-d6b-original-run/coast.bln"
      - name: D8 compile extracted original COASTRD IPTYPE PNPOLY and native C++
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/issue123-d6b-includes"
          work="$RUNNER_TEMP/issue123-d8-oracle"
          gfortran -std=legacy -ffixed-line-length-72 -fno-automatic \
            -fno-align-commons -fallow-argument-mismatch -ffp-contract=off \
            -O0 -I"$stage" "$work/original_d8_routines.for" \
            "$work/d8_driver.for" -o "$work/original_iptype"
          cmake -S "$GITHUB_WORKSPACE/native_cpp" \
            -B "$RUNNER_TEMP/issue123-d8-build" \
            -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/issue123-d8-build" --parallel 2 \
            --target cteas_p2_original_iptype_bln_batch
      - name: D8 original-vs-native authentic BLN point-class scientific gate
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/issue123-d8-oracle"
          (
            cd "$RUNNER_TEMP/issue123-d6b-original-run"
            "$work/original_iptype" < "$work/points.txt" > "$work/fortran_classes.txt"
          )
          "$RUNNER_TEMP/issue123-d8-build/cteas_p2_original_iptype_bln_batch" \
            "$RUNNER_TEMP/issue123-d6b-original-run/coast.bln" \
            < "$work/points.txt" > "$work/cpp_classes.txt"
          python3 -m scripts.s2g.issue123_d8_real_bln_iptype compare --out "$work"
          echo "D8_REAL_BLN_IPTYPE=PASS_SCOPED GLCC_ORIGINAL_MESH_HITS_LU=NOT_RUN"
      - name: D9 actual original GLAZAS LFINAL-F versus C++ 38-class integer HITS
        run: |
          set -euo pipefail
          cmake --build "$RUNNER_TEMP/issue123-d8-build" --parallel 2 \
            --target cteas_p2_original_coast_hits_wolsong
          sha256sum -c <<'SHA'
          4f2a1977d141e2040da4d36ec6a4826c5c960c84686eaf10f226f388cb3ab90a  eausgs2_0la.img
          SHA
          "$RUNNER_TEMP/issue123-d8-build/cteas_p2_original_coast_hits_wolsong" \
            "$GITHUB_WORKSPACE/eausgs2_0la.img" \
            "$RUNNER_TEMP/issue123-d6b-original-run/coast.bln" \
            "$RUNNER_TEMP/issue123-d9-candidate-hits.csv"
          python3 -m scripts.s2g.issue123_d9_original_coastal_hits \
            --original-dir "$RUNNER_TEMP/issue123-d6b-original-run" \
            --native-hits "$RUNNER_TEMP/issue123-d9-candidate-hits.csv" \
            --glcc "$GITHUB_WORKSPACE/eausgs2_0la.img" \
            --out "$RUNNER_TEMP/issue123-d9-hits-report.json"
          echo "D9_REAL_GLAZAS_INTEGER_HITS=PASS_IF_REPORT D10_LU_FRACTIONS=NOT_RUN"
      - name: Archive only JSON SHA/BLN metadata; no raw vendor BLN or IMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue123-d6b-real-original-bln-provenance
          path: |
            ${{ runner.temp }}/issue123-d6b-original-run/input_provenance.json
            ${{ runner.temp }}/issue123-d6b-original-run/split_io_adapter_manifest.json
            ${{ runner.temp }}/issue123-d6b-original-run/eof_adapter_manifest.json
            ${{ runner.temp }}/issue123-d6b-original-run/original_coastext_report.json
            ${{ runner.temp }}/issue123-d8-oracle/d8_provenance.json
            ${{ runner.temp }}/issue123-d8-oracle/d8_iptype_report.json
            ${{ runner.temp }}/issue123-d9-hits-report.json
          if-no-files-found: warn
          retention-days: 21
      - name: Return authentic main science run URL and bounded D6-D9 report to Issue 123
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m scripts.s2g.issue123_science_run_callback \
            --root "$RUNNER_TEMP" \
            --run-id "$GITHUB_RUN_ID" \
            --head-sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" \
            --publish
