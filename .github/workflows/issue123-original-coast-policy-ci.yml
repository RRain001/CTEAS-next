name: Issue123 original CTGPROC coast options (synthetic only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-ctgproc-software-policy-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++-12 libgdal-dev libssl-dev
      - name: Build isolated original coastal policy contract
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/p2-original-policy" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "${RUNNER_TEMP}/p2-original-policy" --parallel 2 --target cteas_p2_original_coast_policy_tests
      - name: Run synthetic scope (NEVER original Fortran science)
        run: |
          set -euo pipefail
          ctest --test-dir "${RUNNER_TEMP}/p2-original-policy" -R '^cteas_p2_original_coast_policy_synthetic$' --output-on-failure
          echo "ISSUE123_ORIGINAL_SAMPLING=PASS_SOFTWARE_SCOPE ORIGINAL_FORTRAN_PARITY=NOT_RUN REAL_GSHHG_COAST=NOT_RUN P2B_EXACT_AREA_V1=FROZEN_UNCHANGED"
