name: Issue53 P2-B native GSHHS Full L1 35-to-38 D3 (synthetic software only)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - native_cpp/src/p2_glc_lu_dat_cli.cpp
      - native_cpp/CMakeLists.txt
      - scripts/s2g/tests/test_p2b_native_gshhg_lu_dat.py
      - docs/plans/ISSUE53_GLC35_USGS38_USER_SELECTED_20261019.json
      - .github/workflows/s2g1bb-issue53-p2b-native-gshhs-d3.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue53-p2b-d3-synthetic-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-gshhs-full-l1-crosswalk-and-lu-format-software-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - name: Checkout source without GLCC LFS or Earth Engine
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Install bounded compiler and GDAL/GEOS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++-12 libgdal-dev libssl-dev gdal-bin python3-gdal python3-numpy
      - name: Build strict C++ native GSHHS parser and GLC area kernel
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/p2b-build" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/p2b-build" --parallel 2 --target cteas_p2_glc_lu_dat cteas_p2_glc_area_tests
          ctest --test-dir "${RUNNER_TEMP}/p2b-build" --output-on-failure -R '^cteas_p2_glc_raw_area_contract$'
      - name: Exact-coastline area split, P2-A-compatible LU and negative science gates
        env:
          CTEAS_P2B_NATIVE_BIN: ${{ runner.temp }}/p2b-build/cteas_p2_glc_lu_dat
        run: |
          set -euo pipefail
          /usr/bin/python3 -m unittest -v scripts.s2g.tests.test_p2b_native_gshhg_lu_dat
          /usr/bin/python3 -m unittest -v scripts.s2g.tests.test_p2b_user_mapping_20261019
          echo "GSHHG_ARCHIVE_ORIGINAL_DATA=NOT_DOWNLOADED_IN_AUTOMATED_PR_CI"
          echo "P2B_D3=PASS_SOFTWARE_SYNTHETIC_ONLY; SCIENCE=NOT_RUN; P3=NOT_RUN"
