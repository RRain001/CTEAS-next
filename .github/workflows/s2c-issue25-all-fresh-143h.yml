name: S2C Issue25 all-fresh native P1-P5 to P6 and independent CALMET 143h
on:
  workflow_dispatch:
permissions:

  contents: read
concurrency:
  group: s2c-issue25-manual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  independently-validated-p6-to-p7:
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    steps:
      - name: Checkout exact code HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Restore untouched original CALPUFF source only for independent science comparator
        uses: actions/checkout@v4
        with:
          repository: RRain001/CTEAS
          ref: dfad99a78ed84d655e21411c9d25eb0d2583bf13
          path: original-cteas
          persist-credentials: false
      - name: Validate selected-case inputs, build toolchains and restore original executable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p7integration/audit" "$RUNNER_TEMP/p7integration/results"
          root="$RUNNER_TEMP/p7integration"
          case=project/cases/hefei5km_2022_reference_case_20261011
          test "$(git -C original-cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          python3 scripts/migration/configure_external_assets.py --source-repo original-cteas
          python3 scripts/migration/configure_external_assets.py --check
          test -s engine/vendor/src/CALMET_v6.5.0_L150223/calmet.for
          echo "b1823cda92280888d70b00961ab39486036a3086e18637fff21efb4f4b237d30  $case/run/met/met.dat" | sha256sum -c -
          echo "cf5cca70cb75b1aac92f86fdc100500e901a8b904d056c73b2330175793532bc  $case/run/puff/puff.inp" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-12 gfortran-11 cmake libgdal-dev
          python3 -m pip install --disable-pip-version-check 'numpy>=1.23,<3' 'pandas>=1.5,<3' 'PyYAML>=6,<7'
          echo "P6_P7_NATIVE_SOURCE_SHA=$(git rev-parse HEAD)" > "$root/audit/source-sha.txt"
          echo "ORIGINAL_CALPUFF_REF=dfad99a78ed84d655e21411c9d25eb0d2583bf13" >> "$root/audit/source-sha.txt"
          echo "CANONICAL_UTM_KM=510.885,3531.269" >> "$root/audit/source-sha.txt"
          echo "P1_P2_P3=FRESH_NATIVE_FROM_SHA_PINNED_SRTM_AND_GLCC" >> "$root/audit/source-sha.txt"
          echo "P4_P5=FRESH_CPP_FSL_GENERIC_TO_FINAL_UP_SURF_STATIONS" >> "$root/audit/source-sha.txt"
          echo "RAW_IGRA_ISD_TO_FSL_GENERIC=ACTUALLY_RECOMPUTED_OFFLINE" >> "$root/audit/source-sha.txt"
      - name: Compile actual 143h native P6 CALMET chain plus P1 P2 P3 writers
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          cmake -S native_cpp/p1 -B "$root/p1" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p1" --parallel 2 --target cteas_p1_terrain
          cmake -S native_cpp -B "$root/p2" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p2" --parallel 2 --target cteas_p2_gen_fraction
          cmake -S native_cpp/p3 -B "$root/p3" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p3" --parallel 2
          ctest --test-dir "$root/p3" --output-on-failure
          cmake -S native_cpp/modules/p4_read62 -B "$root/p4" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p4" --parallel 2 --target cteas_p4_read62
          cmake -S native_cpp/modules/p5_smerge -B "$root/p5" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p5" --parallel 2 --target cteas_p5_smerge
          cmake -S native_cpp/modules/p6_calmet -B "$root/p6d" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p6d" --parallel 2 --target cteas_p6_realcase_wind_field cteas_p6_native_cgamma_grid_143h cteas_p6_native_hourly_driver
          cmake -S native_cpp/modules/p6_calmet/p6e -B "$root/p6e" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build "$root/p6e" --parallel 2 --target p6e_calmet_dat21 p6e_p6c_hourly_bridge
          cmake -S native_cpp/modules/p6_calmet/p6f -B "$root/p6f" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DP6F_REPO_ROOT="$GITHUB_WORKSPACE"
          cmake --build "$root/p6f" --parallel 2 --target cteas_p6f_geo_static_provenance cteas_p6f_p6e_source_metadata
      - name: Offline replay archived 2022 NOAA IGRA and full ISD plus ISD-Lite to real FSL GENERIC
        shell: bash
        timeout-minutes: 55
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          golden="$GITHUB_WORKSPACE/project/cases/hefei5km_2022_reference_case_20261011"
          prepared="$root/original-noaa-raw-replay"
          export PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}"
          python3 native_cpp/orchestration/replay_archived_noaa_2022.py \
            --case "$golden" --work "$prepared" --source-head "$(git rev-parse HEAD)" \
            > "$root/audit/replay-archived-noaa.log" 2>&1 || {
              tail -n 130 "$root/audit/replay-archived-noaa.log";exit 1;
            }
          grep -q 'S3D_P4_FSL_ARCHIVED_RAW_TO_PREPARED_BYTE_IDENTITY=PASS' "$root/audit/replay-archived-noaa.log"
          grep -q 'S3D_P5_GENERIC_ARCHIVED_RAW_TO_PREPARED_BYTE_IDENTITY=PASS' "$root/audit/replay-archived-noaa.log"
          # Isolate an actual case whose prepared source files are the fresh
          # NOAA-derived bytes rather than simply sourcing archived FSL/GENERIC.
          case_id=hefei5km_2022_reference_case_20261011
          mkdir -p "$root/raw-derived-case"
          cp -a "$golden" "$root/raw-derived-case/$case_id"
          stage="$root/raw-derived-case/$case_id"
          cp "$prepared/met/upperair/2022/igra2fsl/58424.txt" \
             "$stage/met/upperair/2022/igra2fsl/58424.txt"
          cp "$prepared/met/surface/isd2smerge_ready/583210-99999.csv" \
             "$stage/met/surface/isd2smerge_ready/583210-99999.csv"
          cmp "$prepared/met/upperair/2022/igra2fsl/58424.txt" "$stage/met/upperair/2022/igra2fsl/58424.txt"
          cmp "$prepared/met/surface/isd2smerge_ready/583210-99999.csv" "$stage/met/surface/isd2smerge_ready/583210-99999.csv"
          cp "$prepared/audit/s3d-archived-noaa-replay.json" "$root/audit/s3d-archived-noaa-replay.json"
          test -z "$(git status --porcelain -- project/cases/hefei5km_2022_reference_case_20261011)"
          echo "S3D_ARCHIVED_NOAA_FSL_GENERIC_FRESH_REPLAY_STAGED=PASS" | tee -a "$root/audit/source-sha.txt"
      - name: Recompute selected P4/P5 actual 2022 C++ outputs and stage them as new P6 inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          case_id=hefei5km_2022_reference_case_20261011
          frozen="$root/raw-derived-case/$case_id"
          producers="$root/fresh-p4-p5"
          python3 native_cpp/orchestration/verify_p4_p5_frozen_lineage.py \
            --case "$frozen" --p4 "$root/p4/cteas_p4_read62" \
            --p5 "$root/p5/cteas_p5_smerge" \
            --work "$producers" --source-head "$(git rev-parse HEAD)" \
            > "$root/audit/new-p4-p5-writer.log" 2>&1 || {
              cat "$root/audit/new-p4-p5-writer.log";exit 1;
            }
          test -s "$producers/met/upperair/final/up_58424.dat"
          test -s "$producers/met/upperair/final/stations.csv"
          test -s "$producers/run/smerge/surf.dat"
          test -s "$producers/met/surface/final/stations.csv"
          mkdir -p "$root/cases"
          cp -a "$frozen" "$root/cases/$case_id"
          current="$root/cases/$case_id"
          cp "$producers/met/upperair/final/up_58424.dat" \
             "$current/met/upperair/final/up_58424.dat"
          cp "$producers/met/upperair/final/stations.csv" \
             "$current/met/upperair/final/stations.csv"
          cp "$producers/run/smerge/surf.dat" "$current/met/surface/final/surf.dat"
          cp "$producers/met/surface/final/stations.csv" "$current/met/surface/final/stations.csv"
          # Both final station tables are freshly regenerated from their
          # preserved source selection metadata, not copied from frozen finals.
          test "$(sha256sum "$producers/met/upperair/final/up_58424.dat" | cut -d' ' -f1)" = \
               "$(sha256sum "$current/met/upperair/final/up_58424.dat" | cut -d' ' -f1)"
          test "$(sha256sum "$producers/run/smerge/surf.dat" | cut -d' ' -f1)" = \
               "$(sha256sum "$current/met/surface/final/surf.dat" | cut -d' ' -f1)"
          test "$(sha256sum "$producers/met/surface/final/stations.csv" | cut -d' ' -f1)" = \
               "$(sha256sum "$current/met/surface/final/stations.csv" | cut -d' ' -f1)"
          cp "$producers/audit/lineage.json" "$root/audit/new-p4-p5-lineage.json"
          echo "S3D_ARCHIVED_NOAA_TO_P4_P5_FINAL_FILES_STAGED=PASS" |
            tee -a "$root/audit/source-sha.txt"
      - name: Generate genuinely fresh native P1 P2 P3 GEO beside freshly produced NOAA P4 P5 in identical scratch case
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          case="$root/cases/hefei5km_2022_reference_case_20261011"
          mkdir -p "$root/p123"
          tif="$root/p123/source-srtm.tif"
          curl --fail --silent --show-error --location --retry 2 --output "$tif" \
            https://raw.githubusercontent.com/RRain001/CTEAS/dfad99a78ed84d655e21411c9d25eb0d2583bf13/calpuff_terrain_and_landuse_data_crop/hefei_5km/china_srtm/srtm_60_06_hefei_5km.tif
          echo "c4211914fce527d2ad41ecac1e668d7faa2904bbbfd9135868ee83ef0d32123f  $tif" | sha256sum -c -
          gen="calpuff_terrain_and_landuse_data_crop/hefei_5km/eurasia_asia_landuse/eausgs2_0la_hefei_5km.generic.txt"
          echo "bd937d99fb13b49ac6185c080359bef050afe76fc63945ac53b7d676547d43dc  $gen" | sha256sum -c -
          "$root/p1/cteas_p1_terrain" "$tif" 510.885 3531.269 "$root/p123/p1.csv"
          "$root/p2/cteas_p2_gen_fraction" "$gen" 510.885 3531.269 "$root/p123/p2.csv"
          "$root/p3/cteas_p12_to_p3_dat" terrain "$root/p123/p1.csv" "$root/p123/terrel.dat"
          "$root/p3/cteas_p12_to_p3_dat" landuse "$root/p123/p2.csv" "$root/p123/lu.dat"
          # Frozen reference is saved only as a comparator outside the solver case.
          mv "$case/geo/makegeo/geo.dat" "$root/p123/frozen-original-geo-only.dat"
          "$root/p3/cteas_p3_makegeo" "$case/geo/makegeo/makegeo.inp" \
            "$root/p123/lu.dat" "$root/p123/terrel.dat" "$root/p123/p3.csv" \
            "$case/geo/makegeo/geo.dat"
          python3 - "$root" "$case" "$tif" "$gen" <<'PY'
          import hashlib,json,pathlib,sys,subprocess
          from native_cpp.reference.compare_p3_makegeo import parse_geo,FIELD_SPECS
          root,case,tif,gen=map(pathlib.Path,sys.argv[1:])
          before=parse_geo(root/"p123/frozen-original-geo-only.dat")
          after=parse_geo(case/"geo/makegeo/geo.dat")
          failures={name:sum(a!=b for a,b in zip(before[name],after[name]))
                    for name,_,_ in FIELD_SPECS}
          assert len(failures)==8 and sum(failures.values())==0,failures
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          roles=("geo/makegeo/geo.dat","met/upperair/final/up_58424.dat",
                 "met/upperair/final/stations.csv","met/surface/final/surf.dat",
                 "met/surface/final/stations.csv","run/met/met.inp")
          manifest={"case":"HEFEI_2022_50x50_100m_143h_SELECTED_NO_RAIN",
                    "science_status":"NOT_RUN",
                    "source_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                    "original_sources":{"srtm_sha256":digest(tif),"glcc_generic_sha256":digest(gen)},
                    "new_geo_vs_frozen_original_physical_field_differences":failures,
                    "fresh_stage_inputs":{
                       rel:{"sha256":digest(case/rel),"bytes":(case/rel).stat().st_size}
                       for rel in roles}}
          (root/"audit/issue25-new-P1-P5-input-sha.json").write_text(json.dumps(manifest,indent=2)+"\n")
          print("ISSUE25_P1_P2_P3_NEW_GEO=PASS_SCOPED")
          print("ISSUE25_NEW_GEO_AND_NEW_NOAA_P4_P5_STAGED_TOGETHER=PASS")
          PY
          test -s "$root/audit/new-p4-p5-lineage.json"
          test ! -L "$case/geo/makegeo/geo.dat"
          echo "ISSUE25_ALL_P1_P5_PRODUCER_FILES_IN_SAME_NEW_P6_CASE=PASS" >> "$root/audit/source-sha.txt"
      - name: Execute real 143h native P6 without source original MET
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          case="$RUNNER_TEMP/p7integration/cases/hefei5km_2022_reference_case_20261011"
          frozen="$case/run/met/met.dat"
          hidden="$root/original-met-hidden.dat"
          mv "$frozen" "$hidden"
          restore() { if test -f "$hidden"; then mv "$hidden" "$frozen"; fi; }
          trap restore EXIT
          test ! -e "$frozen"
          "$root/p6d/cteas_p6_native_hourly_driver" \
            --case "$case" \
            --p6d "$root/p6d/cteas_p6_realcase_wind_field" \
            --p6e "$root/p6e/p6e_calmet_dat21" \
            --bridge "$root/p6e/p6e_p6c_hourly_bridge" \
            --cgamma "$root/p6d/cteas_p6_native_cgamma_grid_143h" \
            --work "$root/native-p6" --hours 143 --emit-source-stage-trace \
            --p6f-writer "$root/p6f/cteas_p6f_geo_static_provenance" \
            --p6e-source-builder "$root/p6f/cteas_p6f_p6e_source_metadata" \
            --p6f-direct-hourly > "$root/audit/native-p6-143h.log" 2>&1 || {
              tail -n 90 "$root/audit/native-p6-143h.log";exit 1;
            }
          test ! -e "$frozen"
          restore
          trap - EXIT
          native="$root/native-p6/native_causal_independent_header_calmet.dat"
          test -s "$native"
          grep -q '"original_met_role": "NOT_REQUIRED_NOT_OPENED_BY_NATIVE_EXECUTION"' "$root/native-p6/native_cpp_hourly_manifest.json"
          "$root/p6e/p6e_calmet_dat21" compare \
            --reference "$frozen" --candidate "$native" \
            --out "$root/audit/native-P6-vs-frozen-MET-45fields.json"
          sha256sum "$native" "$frozen" > "$root/audit/native-original-met-sha256.txt"
          echo "ISSUE25_NEW_P1_TO_P5_FRESH_NATIVE_P6_143H_EXECUTED=TRUE" >> "$root/audit/source-sha.txt"
      - name: Independent untouched original CALMET same freshly produced GEO UP SURF versus native P6 143h all 45-field gate
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p7integration"
          vendor="engine/vendor/src/CALMET_v6.5.0_L150223"
          test -s "$vendor/calmet.for"
          test "$(git -C original-cteas rev-parse HEAD)" = dfad99a78ed84d655e21411c9d25eb0d2583bf13
          mkdir -p "$root/calmet-inc"
          for input in "$vendor"/*; do
            if test -f "$input"; then
              short="$(basename "$input" | tr '[:upper:]' '[:lower:]')"
              ln -s "$(realpath "$input")" "$root/calmet-inc/$short"
            fi
          done
          gfortran-11 -std=legacy -ffixed-line-length-none -fno-automatic \
            -fno-align-commons -fallow-argument-mismatch -O0 \
            -I"$root/calmet-inc" "$vendor/calmet.for" -o "$root/original-calmet.x"
          case="$root/cases/hefei5km_2022_reference_case_20261011"
          original="$root/independent-original-same-new-input-case"
          cp -a "$case" "$original"
          rm -f "$original/run/met/met.dat"
          test ! -e "$original/run/met/met.dat"
          for f in geo/makegeo/geo.dat met/upperair/final/up_58424.dat \
                   met/upperair/final/stations.csv met/surface/final/surf.dat \
                   met/surface/final/stations.csv run/met/met.inp; do
            cmp "$case/$f" "$original/$f"
          done
          (cd "$original/run/met" && "$root/original-calmet.x" met.inp) \
            > "$root/audit/issue25-original-calmet.stdout" \
            2> "$root/audit/issue25-original-calmet.stderr" || {
              tail -n 100 "$root/audit/issue25-original-calmet.stdout"
              tail -n 100 "$root/audit/issue25-original-calmet.stderr"
              exit 1
            }
          test -s "$original/run/met/met.dat"
          native="$root/native-p6/native_causal_independent_header_calmet.dat"
          test -s "$native"
          "$root/p6e/p6e_calmet_dat21" compare \
            --reference "$original/run/met/met.dat" --candidate "$native" \
            --out "$root/audit/issue25-all-fresh-143h-45fields.json" \
            > "$root/audit/issue25-calmet-compare.stdout" 2>&1 || {
              tail -n 100 "$root/audit/issue25-calmet-compare.stdout"
              exit 1
            }
          python3 - "$root" <<'PY'
          import json,pathlib,hashlib,sys
          root=pathlib.Path(sys.argv[1])
          science=json.loads((root/"audit/issue25-all-fresh-143h-45fields.json").read_text())
          assert science["intervals"]==143 and science["total_exceedances"]==0,science
          manifest=root/"audit/issue25-new-P1-P5-input-sha.json"
          evidence=json.loads(manifest.read_text())
          case=root/"cases/hefei5km_2022_reference_case_20261011"
          for relative,old in evidence["fresh_stage_inputs"].items():
              f=case/relative
              assert f.stat().st_size==old["bytes"]
              assert hashlib.sha256(f.read_bytes()).hexdigest()==old["sha256"],relative
          evidence["science_status"]="PASS_SCOPED_143H_SAME_NEW_SOURCE_45_FIELDS"
          evidence["intervals"]=science["intervals"]
          evidence["total_exceedances"]=science["total_exceedances"]
          manifest.write_text(json.dumps(evidence,indent=2)+"\n")
          print("ISSUE25_ALL_FRESH_P1_P2_P3_P4_P5_NATIVE_P6_VS_ORIGINAL_143H=PASS_SCOPED")
          PY
      - name: Publish source/provenance and numerical JSON only; never NOAA source or model binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue25-fresh-p1-p5-native-p6-original-science-audit
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/p7integration/audit/*.json
            ${{ runner.temp }}/p7integration/audit/*.txt
            ${{ runner.temp }}/p7integration/audit/*.log
            ${{ runner.temp }}/p7integration/audit/*.stdout
            ${{ runner.temp }}/p7integration/audit/*.stderr
