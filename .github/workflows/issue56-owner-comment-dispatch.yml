name: Issue56 owner manual real NOAA P5 D4 dispatch
# Only an explicit owner-authored comment on open Issue #56 may launch
# the separate, pinned workflow_dispatch scientific verification.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: write
jobs:
  issue56-explicit-owner-science-dispatch:
    if: >-
      github.repository == 'RRain001/CTEAS-next' &&
      github.event.issue.number == 56 &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'RRain001' &&
      github.event.comment.body == '/cteas-p5-d4-real-all'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dispatch reviewed authentic NOAA SMERGE parity and D4 evidence from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: RRain001/CTEAS-next
        run: |
          set -euo pipefail
          gh workflow run issue56-real-noaa-p5-manual.yml --ref main --field scenario=all
          echo 'ISSUE56_EXPLICIT_OWNER_MANUAL_REAL_NOAA_D4_DISPATCH_ACCEPTED'
          echo 'This dispatcher is not a scientific PASS; only downstream run evidence may pass'
