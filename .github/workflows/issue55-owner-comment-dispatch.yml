name: Issue55 owner issue-command full-year manual workflow dispatcher
# Explicit owner-issued issue comment; this is not an unattended full science run.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: write
jobs:
  issue55-authorized-manual-dispatch:
    if: >-
      github.repository == 'RRain001/CTEAS-next' &&
      github.event.issue.number == 55 &&
      !github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.login == 'RRain001' &&
      github.event.comment.body == '/cteas-p4-d3-2023-full'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Dispatch fixed 2023 annual independent original READ62 workflow from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: RRain001/CTEAS-next
        run: |
          set -euo pipefail
          gh workflow run issue55-p4-d3-full-year-manual.yml --ref main
          echo "ISSUE55_OWNER_EXPLICIT_MANUAL_D3_2023_FULL_DISPATCH_ACCEPTED"
          echo "Original 730-profile scientific gate is the downstream workflow result, not this dispatch job"
