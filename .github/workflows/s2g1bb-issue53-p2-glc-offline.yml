name: Issue53 P2 GLC native offline raw area contract (not crosswalk science)
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - native_cpp/include/cteas/geo/glc_area_fractions.hpp
      - native_cpp/src/geo/glc_area_fractions.cpp
      - native_cpp/src/p2_glc_area_cli.cpp
      - native_cpp/tests/p2_glc_area_tests.cpp
      - native_cpp/CMakeLists.txt
      - docker/cpp/Dockerfile
      - scripts/migration/validate_ubuntu.py
      - .github/workflows/s2g1bb-issue53-p2-glc-offline.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue53-p2-glc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scoped-offline-native-p2:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout source and committed real 6168B GeoTIFF (no Git LFS, no remote acquisition)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          lfs: false
      - name: Install system GDAL and OpenSSL development headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgdal-dev libssl-dev cmake
      - name: Build P2 with strict warnings and run offline arithmetic fixtures
        shell: bash
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/issue53-p2-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/issue53-p2-build" --target cteas_p2_glc_raw cteas_p2_glc_area_tests cteas_p2_gen_tests -j2
          ctest --test-dir "${RUNNER_TEMP}/issue53-p2-build" --output-on-failure -R '^cteas_p2_(glc_raw_area_contract|gen_fraction_contract)$'
      - name: Genuine committed GLC TIFF offline raw fractions (mapping remains blocked)
        shell: bash
        env:
          TIFF: data/landcover/glc_fcs30d/v1_2022/hefei/hefei_2022_30m.tif
          SHA: 340d224d961c88637363be9616302bdf6b955b4921144edc814b875ef9798473
        run: |
          set -euo pipefail
          test "$(wc -c < "$TIFF")" -eq 6168
          echo "$SHA  $TIFF" | sha256sum -c -
          bin="${RUNNER_TEMP}/issue53-p2-build/cteas_p2_glc_raw"
          output="${RUNNER_TEMP}/issue53-hefei-real-raw-fractions"
          "$bin" "$TIFF" "$output" "$SHA" 32650 510.885 3531.269 0.100 50 50
          if "$bin" "$TIFF" "${RUNNER_TEMP}/invalid-p2" "$(printf '0%.0s' {1..64})" 32650 510.885 3531.269 0.100 50 50; then
            echo 'FAIL: wrong SHA admitted'; exit 1
          fi
          python3 - "$output" <<'PY'
          import csv,json,sys
          from pathlib import Path
          folder=Path(sys.argv[1])
          meta=json.loads((folder/'p2_manifest.json').read_text())
          assert meta['source_sha256']=='340d224d961c88637363be9616302bdf6b955b4921144edc814b875ef9798473'
          assert meta['crosswalk_status']=='P2_MAPPING_REVIEW_REQUIRED'
          assert meta['usgs92_lu_dat']=='NOT_RUN' and meta['p3_geo_dat']=='NOT_RUN'
          with (folder/'p2_raw_fractions.csv').open(newline='') as stream:
              rows=list(csv.DictReader(stream))
          assert len(rows)==2500
          cols=[f'glc{x}' for x in (10,11,12,20,51,52,61,62,71,72,81,82,91,92,120,121,122,130,140,150,152,153,181,182,183,184,185,186,187,190,200,201,202,210,220)]
          assert len(cols)==35 and all(k in rows[0] for k in cols)
          for n,row in enumerate(rows):
              assert (int(row['i']),int(row['j']))==(n%50+1,n//50+1)
              assert abs(float(row['valid_area_m2'])-10000.)<1e-6
              assert abs(float(row['coverage_fraction'])-1.)<1e-12
              assert abs(sum(float(row[k]) for k in cols)-1.)<2e-9
          assert not (folder/'LU.DAT').exists() and not (folder/'GEO.DAT').exists()
          print('P2_REAL_GLC_6168B=PASS_SOURCE_AND_SOFTWARE; MAPPING=REVIEW_REQUIRED; P3=NOT_RUN')
          PY
          cp "$output/p2_manifest.json" "${RUNNER_TEMP}/issue53-glc-manifest.json"
      - name: Upload only provenance, not source pixels
        uses: actions/upload-artifact@v4
        with:
          name: issue53-glc-raw-area-source-contract
          path: ${{ runner.temp }}/issue53-glc-manifest.json
          if-no-files-found: error
