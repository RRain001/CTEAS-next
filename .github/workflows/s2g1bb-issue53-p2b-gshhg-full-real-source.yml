name: Issue53 P2-B REAL GSHHG Full 2.3.7 + Hefei 2022 GLCC-independent source gate (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue53-p2b-gshhg-real-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-gshhs-full-hefei-glc2022-native-d3:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout real 2022 GLC GeoTIFF, no GLCC Git LFS
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          lfs: false
      - name: Install GDAL/GEOS and strict C++ build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++-12 libgdal-dev libssl-dev gdal-bin unzip
      - name: Retrieve ORIGINAL GMT GSHHG v2.3.7 Full Shapefile ZIP; verify release SHA256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/p2b-gshhg"
          curl -fsSL --retry 4 --retry-delay 5 --connect-timeout 30 --max-time 900 \
            -o "${RUNNER_TEMP}/p2b-gshhg/gshhg-shp-2.3.7.zip" \
            'https://github.com/GenericMappingTools/gshhg-gmt/releases/download/2.3.7/gshhg-shp-2.3.7.zip'
          cd "${RUNNER_TEMP}/p2b-gshhg"
          echo '8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41  gshhg-shp-2.3.7.zip' | sha256sum -c -
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'p2b-gshhg'
          z=root/'gshhg-shp-2.3.7.zip'
          with zipfile.ZipFile(z) as archive:
            names=archive.namelist()
            for ext in ('.shp','.shx','.dbf','.prj'):
              suffix=f'GSHHS_shp/f/GSHHS_f_L1{ext}'
              found=[n for n in names if n.endswith(suffix)]
              assert len(found)==1,(suffix,found)
              target=root/f'GSHHS_f_L1{ext}'
              with archive.open(found[0]) as src, target.open('wb') as dest:
                import shutil;shutil.copyfileobj(src,dest)
              assert target.stat().st_size>0, str(target)
              print('VERIFIED_EXTRACTED_GSHHS_FULL_L1',target.name,target.stat().st_size)
          PY
          ogrinfo -ro -so "${RUNNER_TEMP}/p2b-gshhg/GSHHS_f_L1.shp" GSHHS_f_L1
      - name: Build C++ producer and recheck true source SHA
        run: |
          set -euo pipefail
          cmake -S native_cpp -B "${RUNNER_TEMP}/p2b-build" -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/p2b-build" --parallel 2 --target cteas_p2_glc_lu_dat
          TIFF=data/landcover/glc_fcs30d/v1_2022/hefei/hefei_2022_30m.tif
          echo "340d224d961c88637363be9616302bdf6b955b4921144edc814b875ef9798473  $TIFF" | sha256sum -c -
          test "$(wc -c < "$TIFF")" -eq 6168
      - name: REAL GSHHS Full + REAL 2022 GLC 2500-cell P2-B 38-class LU.DAT; no original P3
        shell: bash
        run: |
          set -euo pipefail
          TIFF=data/landcover/glc_fcs30d/v1_2022/hefei/hefei_2022_30m.tif
          POLICY=docs/plans/ISSUE53_GLC35_USGS38_USER_SELECTED_20261019.json
          GSHHS="${RUNNER_TEMP}/p2b-gshhg/GSHHS_f_L1.shp"
          "${RUNNER_TEMP}/p2b-build/cteas_p2_glc_lu_dat" \
            "$TIFF" 340d224d961c88637363be9616302bdf6b955b4921144edc814b875ef9798473 \
            "$GSHHS" "$(sha256sum "$GSHHS" | awk '{print $1}')" \
            "$POLICY" "$(sha256sum "$POLICY" | awk '{print $1}')" \
            "${RUNNER_TEMP}/p2b-real-d3" 32650 510.885 3531.269 0.100 50 50
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          p=root/'p2b-real-d3'
          m=json.loads((p/'p2_b_d3_manifest.json').read_text())
          assert m['n_cells']==2500 and m['n_usgs_classes']==38
          assert m['usgs52_inland_water_area_m2']>0,m
          assert abs(m['usgs55_ocean_water_area_m2'])<1.e-5,m
          assert m['max_fraction_sum_error']<1.e-9
          assert m['evidence_status']=='PRODUCED_UNVERIFIED'
          assert m['original_makegeo_38_to_14_parity']=='NOT_RUN'
          rows=(p/'lu.dat').read_text().splitlines()
          assert len(rows)==2511,len(rows)
          assert all(len(line.split())==41 and line.split()[-1]=='.' for line in rows[11:])
          prior='8dbbe7e071e77e9e75f2d639239099ebca8d5c16d6a07df8169729d49f15cf41'
          h=hashlib.sha256((root/'p2b-gshhg/gshhg-shp-2.3.7.zip').read_bytes()).hexdigest()
          assert h==prior
          attestation={
            'gate':'ISSUE53_P2B_REAL_GSHHG_FULL_AND_GLC2022_SOURCE_VERIFIED_ENGINEERING_ONLY',
            'release_zip_sha256':h,'archive_sha256_verified':True,
            'glc_tif_sha256':m['glc_tif_sha256'],
            'gshhs_l1_shp_sha256':m['gshhs_l1_shp_sha256'],
            'mapping_policy_sha256':m['mapping_policy_sha256'],
            'lu_dat_sha256':m['lu_dat_sha256'],'cells':2500,
            'inland_m2':m['usgs52_inland_water_area_m2'],
            'marine_m2':m['usgs55_ocean_water_area_m2'],
            'coastal_source_validation':'NOT_RUN',
            'original_makegeo_science_validation':'NOT_RUN',
            'science_conclusion':'NOT_ACCEPTED',
          }
          (p/'real_gshhg_source_attestation.json').write_text(json.dumps(attestation,indent=2)+'\n')
          print(json.dumps(attestation,sort_keys=True))
          PY
      - name: Upload source-bound real-origin LU and manifest, never vendor shapefiles
        uses: actions/upload-artifact@v4
        with:
          name: issue53-p2b-real-glc2022-gshhs-full-hefei-source-only-NOT_SCIENCE
          path: |
            ${{ runner.temp }}/p2b-real-d3/lu.dat
            ${{ runner.temp }}/p2b-real-d3/p2_b_d3_manifest.json
            ${{ runner.temp }}/p2b-real-d3/real_gshhg_source_attestation.json
          if-no-files-found: error
